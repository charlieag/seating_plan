<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iSAMS Seating Planner - Multi-class MHTML Import</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fa;color:#18202a}main{max-width:1250px;margin:auto;padding:32px 20px}.card{background:#fff;border:1px solid #d8dee6;border-radius:12px;padding:22px;margin-bottom:16px}.file-label,.button{font:inherit;padding:11px 16px;border-radius:8px;border:1px solid #285bd6;background:#285bd6;color:#fff;cursor:pointer;display:inline-block}.button.secondary{background:#fff;color:#18202a;border-color:#bcc5d1}.button:disabled{opacity:.5;cursor:not-allowed}input[type=file]{position:absolute;left:-9999px;width:1px;height:1px}.status{padding:12px;margin-top:14px;border-radius:8px;background:#eef1f5}.ok{background:#eaf7ef;color:#17683a}.bad{background:#fff0f0;color:#9e2929}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}.metric{border:1px solid #dde2e8;border-radius:10px;padding:12px}.metric small{display:block;color:#697584;margin-bottom:4px}.metric strong{font-size:20px}.classes{display:grid;gap:12px}.class-card{border:1px solid #d8dee6;border-radius:10px;padding:16px}.class-head{display:flex;gap:12px;align-items:flex-start}.class-head input{width:20px;height:20px;margin-top:3px}.class-name{font-weight:700;font-size:17px}.muted{color:#697584;font-size:13px}.warn{color:#8a5a00}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid #dde2e8;vertical-align:middle}th{font-size:13px;background:#f8f9fb;white-space:nowrap}.student-photo{width:56px;height:70px;object-fit:cover;border:1px solid #d8dee8;border-radius:7px;background:#eef1f4;display:block}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f0f2f5;border:1px solid #d8dee2;font-size:12px;margin:3px 3px 0 0}.version{color:#697584;font-size:12px}
</style>
</head>
<body>
<main>
<div class="card">
<h1>iSAMS Seating Planner</h1>
<p><strong>Multi-class MHTML importer</strong></p><p class="version">Build 0.4.0</p>
<p class="muted">Reads the MHTML entirely in this browser. Nothing is uploaded.</p>
<label class="file-label" for="file">Choose iSAMS MHTML</label><input id="file" type="file">
<div id="status" class="status">Ready.</div>
</div>
<div id="result" hidden></div>
</main>
<script>
"use strict";
const fileInput=document.getElementById("file"),statusBox=document.getElementById("status"),result=document.getElementById("result");
function clean(v){if(v==null)return "";const t=typeof v==="string"?v:(typeof v.textContent==="string"?v.textContent:String(v));return t.replace(/\u00a0/g," ").replace(/\s+/g," ").trim()}
function setStatus(m,k){statusBox.textContent=m;statusBox.className="status"+(k?" "+k:"")}
function decodeQuotedPrintable(s){return s.replace(/=\r?\n/g,"").replace(/=([0-9A-Fa-f]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)))}
function decodeB64(s){const b=atob(s.replace(/[\r\n\t ]/g,""));const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function headers(block){const out={};let current="";for(const line of block.replace(/\r\n/g,"\n").split("\n")){if(/^[ \t]/.test(line)&&current){out[current]+=" "+line.trim();continue}const m=line.match(/^([^:]+):\s*(.*)$/);if(m){current=m[1].toLowerCase();out[current]=m[2].trim()}}return out}
function parseMhtml(raw){const first=raw.search(/\r?\n\r?\n/);if(first<0)throw Error("Invalid MHTML: MIME headers not found.");const top=headers(raw.slice(0,first));const bm=(top["content-type"]||"").match(/boundary\s*=\s*(?:"([^"]+)"|([^;]+))/i);if(!bm)throw Error("Invalid MHTML: MIME boundary not found.");const boundary=(bm[1]||bm[2]).trim(),parts=[];for(let chunk of raw.split("--"+boundary)){chunk=chunk.replace(/^\r?\n/,"");if(!chunk.trim()||chunk.trim()==="--")continue;const sep=chunk.search(/\r?\n\r?\n/);if(sep<0)continue;const h=headers(chunk.slice(0,sep));let body=chunk.slice(sep).replace(/^\r?\n\r?\n/,"").replace(/\r?\n--$/i,"");const enc=(h["content-transfer-encoding"]||"").toLowerCase();if(enc==="quoted-printable")body=decodeQuotedPrintable(body);parts.push({headers:h,body})}const html=parts.find(p=>(p.headers["content-type"]||"").toLowerCase().split(";")[0].trim()==="text/html");if(!html)throw Error("No text/html part found in MHTML.");const images=parts.filter(p=>{const t=(p.headers["content-type"]||"").toLowerCase().split(";")[0].trim();return (t==="image/jpeg"||t==="image/jpg")&&(p.headers["content-transfer-encoding"]||"").toLowerCase()==="base64"}).map(p=>({location:p.headers["content-location"]||"",bytes:decodeB64(p.body)}));return {html:html.body,images}}
function rows(table){const out=[];for(const c of table.children){if(c.tagName==="TR")out.push(c);else if(/^(THEAD|TBODY|TFOOT)$/.test(c.tagName))for(const r of c.children)if(r.tagName==="TR")out.push(r)}return out}
function cells(row){return [...row.children].filter(e=>e.tagName==="TD"||e.tagName==="TH")}
function removeNumber(vals){const v=[...vals];if(v.length&&/^\d+\.$/.test(v[0]))v.shift();return v}
function tableIsStudent(table){return rows(table).some(r=>{const vals=removeNumber(cells(r).map(clean)).map(x=>x.toLowerCase());return vals.includes("surname")&&vals.includes("preferred name")})}
function findStudentTable(doc,afterTableIndex){const tables=[...doc.querySelectorAll("table")];for(let i=afterTableIndex||0;i<tables.length;i++)if(tableIsStudent(tables[i]))return {table:tables[i],index:i};return null}
function parseStudentTable(table){const rs=rows(table);let hi=-1,headers=[];for(let i=0;i<rs.length;i++){const vals=removeNumber(cells(rs[i]).map(clean));const low=vals.map(x=>x.toLowerCase());if(low.includes("surname")&&low.includes("preferred name")){hi=i;headers=vals;break}}if(hi<0)throw Error("Student table header not found.");const students=[];for(const r of rs.slice(hi+1)){const vals=removeNumber(cells(r).map(clean));if(!vals.length)continue;const low=vals.map(x=>x.toLowerCase());if(low.includes("surname")&&low.includes("preferred name"))continue;const fields={};headers.forEach((h,i)=>fields[h]=vals[i]||"");const si=headers.findIndex(h=>h.toLowerCase()==="surname"),pi=headers.findIndex(h=>h.toLowerCase()==="preferred name");if((vals[si]||"")||(vals[pi]||""))students.push({fields,surname:vals[si]||"",preferred:vals[pi]||""})}return {headers,students}}
function normalName(s){return clean(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9() ]+/g," ").replace(/\s+/g," ").trim()}
function photoNames(text){const s=clean(text).replace(/\s+/g," ").trim();const m=s.match(/^(.+?)\s+(.+?)\s*\(([^)]+)\)$/);if(m)return [normalName(m[1]+" "+m[2]),normalName(m[3]+" "+m[2]),normalName(m[1]+" "+m[2]+" ("+m[3]+")")];return [normalName(s)]}
function basename(u){try{return decodeURIComponent((u||"").split("/").pop().split("?")[0].split("#")[0])}catch{return (u||"").split("/").pop().split("?")[0].split("#")[0]}}
function galleryForDoc(doc){const out=[];for(const img of doc.querySelectorAll("img")){const src=img.getAttribute("src")||"",href=img.closest("a")?.getAttribute("href")||src,file=basename(href);if(!/\.jpe?g$/i.test(file))continue;const cell=img.closest("td");if(!cell)continue;let text="";for(const n of cell.childNodes)if(n.nodeType===3)text+=" "+n.textContent;out.push({file,name:clean(text)})}return out}
function imageIndex(images){const m=new Map();for(const im of images)m.set(basename(im.location).toLowerCase(),im);return m}
function matchPhotos(students,gallery,images){const index=imageIndex(images);let matched=0;const used=new Set();for(const st of students){const wanted=new Set([normalName(st.preferred+" "+st.surname),normalName(st.surname+" "+st.preferred)]);let hit=null;for(const g of gallery){if(used.has(g.file))continue;if(photoNames(g.name).some(n=>wanted.has(n))){hit=g;break}}if(hit){const im=index.get(hit.file.toLowerCase());if(im){st.image=im;used.add(hit.file);matched++}}}return {matched,galleryCount:gallery.length}}
function sectionInfo(doc,table){let meta={};let node=table.parentElement;for(let level=0;node&&level<6;level++,node=node.parentElement){const text=clean(node.textContent);const m=text.match(/Set Name\s*:?\s*([^\n|]+?)(?=Teacher\s*:|Grade Group\s*:|Linked Teachers\s*:|Subject\s*:|Set Code\s*:|$)/i);if(m){meta.setName=clean(m[1]);break}}if(!meta.setName){const all=clean(doc.body.textContent);const before=all.slice(0,Math.max(0,all.indexOf(clean(table.textContent))));const ms=[...before.matchAll(/Set Name\s*:?\s*([^\n]+?)(?=Teacher\s*:|Grade Group\s*:|Subject\s*:|Set Code\s*:|Set List|$)/gi)];if(ms.length)meta.setName=clean(ms[ms.length-1][1])}return meta}
function parseAll(mhtml){const doc=new DOMParser().parseFromString(mhtml.html,"text/html");const tables=[...doc.querySelectorAll("table")];const studentTables=tables.filter(tableIsStudent);if(!studentTables.length)throw Error("No iSAMS student tables found.");const classes=[];for(let i=0;i<studentTables.length;i++){const table=studentTables[i],parsed=parseStudentTable(table),meta=sectionInfo(doc,table);const gallery=galleryForDoc(doc);const photos=matchPhotos(parsed.students,gallery,mhtml.images);classes.push({meta,headers:parsed.headers,students:parsed.students,photos})}return {classes,images:mhtml.images.length}}
function photoUrl(im){return URL.createObjectURL(new Blob([im.bytes],{type:"image/jpeg"}))}
function render(data){result.hidden=false;result.replaceChildren();const top=document.createElement("div");top.className="card";const h=document.createElement("h2");h.textContent=data.classes.length+" classes detected";top.appendChild(h);const p=document.createElement("p");p.className="muted";p.textContent=data.classes.reduce((n,c)=>n+c.students.length,0)+" students · "+data.images+" embedded JPEGs";top.appendChild(p);result.appendChild(top);const list=document.createElement("div");list.className="classes";data.classes.forEach((c,i)=>{const card=document.createElement("div");card.className="class-card";const head=document.createElement("div");head.className="class-head";const cb=document.createElement("input");cb.type="checkbox";cb.checked=true;cb.dataset.index=i;head.appendChild(cb);const info=document.createElement("div");const name=document.createElement("div");name.className="class-name";name.textContent=c.meta.setName||"Unnamed class";info.appendChild(name);const detail=document.createElement("div");detail.className="muted";detail.textContent=c.students.length+" students · "+c.photos.galleryCount+" photos found · "+c.photos.matched+" matched";info.appendChild(detail);if(!c.meta.setName){const w=document.createElement("div");w.className="muted warn";w.textContent="Class name could not be identified from this section.";info.appendChild(w)}head.appendChild(info);card.appendChild(head);const pills=document.createElement("div");c.headers.forEach(x=>{const s=document.createElement("span");s.className="pill";s.textContent=x;pills.appendChild(s)});card.appendChild(pills);list.appendChild(card)});result.appendChild(list);const actions=document.createElement("div");actions.className="actions";const importBtn=document.createElement("button");importBtn.type="button";importBtn.className="button";importBtn.textContent="Import selected classes";importBtn.addEventListener("click",()=>{const selected=[...list.querySelectorAll("input:checked")].map(x=>data.classes[Number(x.dataset.index)]);setStatus("Ready to import "+selected.length+" classes. This is the next data-model step.","ok")});actions.appendChild(importBtn);result.appendChild(actions)}
fileInput.addEventListener("change",async()=>{const file=fileInput.files?.[0];if(!file)return;setStatus("Reading "+file.name+"...");try{const raw=await file.text();const m=parseMhtml(raw);const data=parseAll(m);render(data);setStatus("Import analysis complete - "+data.classes.length+" classes detected.","ok")}catch(e){console.error(e);setStatus("Import failed: "+e.message,"bad")}});
</script>
</body>
</html>
