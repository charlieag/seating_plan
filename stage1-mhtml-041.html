<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>iSAMS Seating Planner - Multi-class MHTML Import</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fa;color:#18202a}main{max-width:1250px;margin:auto;padding:32px 20px}.card{background:#fff;border:1px solid #d8dee6;border-radius:12px;padding:22px;margin-bottom:16px}.file-label,.button{font:inherit;padding:11px 16px;border-radius:8px;border:1px solid #285bd6;background:#285bd6;color:#fff;cursor:pointer;display:inline-block}.button.secondary{background:#fff;color:#18202a;border-color:#bcc5d1}.button:disabled{opacity:.5;cursor:not-allowed}input[type=file]{position:absolute;left:-9999px;width:1px;height:1px}.status{padding:12px;margin-top:14px;border-radius:8px;background:#eef1f5}.ok{background:#eaf7ef;color:#17683a}.bad{background:#fff0f0;color:#9e2929}.classes{display:grid;gap:12px}.class-card{border:1px solid #d8dee6;border-radius:10px;padding:16px}.class-head{display:flex;gap:12px;align-items:flex-start}.class-head input{width:20px;height:20px;margin-top:3px}.class-name{font-weight:700;font-size:17px}.muted{color:#697584;font-size:13px}.warn{color:#8a5a00}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#f0f2f5;border:1px solid #d8dee2;font-size:12px;margin:3px 3px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.version{color:#697584;font-size:12px}</style></head><body><main><div class="card"><h1>iSAMS Seating Planner</h1><p><strong>Multi-class MHTML importer</strong></p><p class="version">Build 0.4.1</p><p class="muted">Reads the MHTML entirely in this browser. Nothing is uploaded.</p><label class="file-label" for="file">Choose iSAMS MHTML</label><input id="file" type="file"><div id="status" class="status">Ready.</div></div><div id="result" hidden></div></main><script>"use strict";
const fileInput=document.getElementById("file"),statusBox=document.getElementById("status"),result=document.getElementById("result");
function clean(v){if(v==null)return "";const t=typeof v==="string"?v:(typeof v.textContent==="string"?v.textContent:String(v));return t.replace(/\u00a0/g," ").replace(/\s+/g," ").trim()}
function setStatus(m,k){statusBox.textContent=m;statusBox.className="status"+(k?" "+k:"")}
function decodeQP(s){return s.replace(/=\r?\n/g,"").replace(/=([0-9A-Fa-f]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)))}
function decodeB64(s){const b=atob(s.replace(/[\r\n\t ]/g,""));const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}
function parseHeaders(block){const out={};let current="";for(const line of block.replace(/\r\n/g,"\n").split("\n")){if(/^[ \t]/.test(line)&&current){out[current]+=" "+line.trim();continue}const m=line.match(/^([^:]+):\s*(.*)$/);if(m){current=m[1].toLowerCase();out[current]=m[2].trim()}}return out}
function parseMhtml(raw){const p=raw.search(/\r?\n\r?\n/);if(p<0)throw Error("Invalid MHTML: MIME headers not found.");const top=parseHeaders(raw.slice(0,p));const bm=(top["content-type"]||"").match(/boundary\s*=\s*(?:"([^"]+)"|([^;]+))/i);if(!bm)throw Error("Invalid MHTML: MIME boundary not found.");const boundary=(bm[1]||bm[2]).trim(),parts=[];for(let chunk of raw.split("--"+boundary)){chunk=chunk.replace(/^\r?\n/,"");if(!chunk.trim()||chunk.trim()==="--")continue;const s=chunk.search(/\r?\n\r?\n/);if(s<0)continue;const h=parseHeaders(chunk.slice(0,s));let body=chunk.slice(s).replace(/^\r?\n\r?\n/,"").replace(/\r?\n--$/i,"");const enc=(h["content-transfer-encoding"]||"").toLowerCase();if(enc==="quoted-printable")body=decodeQP(body);parts.push({headers:h,body})}const html=parts.find(x=>(x.headers["content-type"]||"").toLowerCase().split(";")[0].trim()==="text/html");if(!html)throw Error("No text/html part found in MHTML.");const images=parts.filter(x=>{const t=(x.headers["content-type"]||"").toLowerCase().split(";")[0].trim();return (t==="image/jpeg"||t==="image/jpg")&&(x.headers["content-transfer-encoding"]||"").toLowerCase()==="base64"}).map(x=>({location:x.headers["content-location"]||"",bytes:decodeB64(x.body)}));return {html:html.body,images}}
function directRows(table){const out=[];for(const c of table.children){if(c.tagName==="TR")out.push(c);else if(/^(THEAD|TBODY|TFOOT)$/.test(c.tagName))for(const r of c.children)if(r.tagName==="TR")out.push(r)}return out}
function directCells(row){return [...row.children].filter(x=>x.tagName==="TD"||x.tagName==="TH")}
function removeNumber(v){const a=[...v];if(a.length&&/^\d+\.$/.test(a[0]))a.shift();return a}
function isStudentTable(t){return directRows(t).some(r=>{const v=removeNumber(directCells(r).map(clean)).map(x=>x.toLowerCase());return v.includes("surname")&&v.includes("preferred name")})}
function parseStudentTable(table){const rs=directRows(table);let header=-1,headers=[];for(let i=0;i<rs.length;i++){const v=removeNumber(directCells(rs[i]).map(clean));const low=v.map(x=>x.toLowerCase());if(low.includes("surname")&&low.includes("preferred name")){header=i;headers=v;break}}if(header<0)throw Error("Student table header not found.");const si=headers.findIndex(x=>x.toLowerCase()==="surname"),pi=headers.findIndex(x=>x.toLowerCase()==="preferred name"),students=[];for(const r of rs.slice(header+1)){const v=removeNumber(directCells(r).map(clean));if(!v.length)continue;const f={};headers.forEach((h,i)=>f[h]=v[i]||"");if((v[si]||"")||(v[pi]||""))students.push({fields:f,surname:v[si]||"",preferred:v[pi]||""})}return {headers,students}}
function norm(s){return clean(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9 ]+/g," ").replace(/\s+/g," ").trim()}
function nameVariants(text){const s=clean(text);const out=[norm(s)];const m=s.match(/^(.*?)\s*\(([^)]+)\)\s*$/);if(m){const before=norm(m[1]),inside=norm(m[2]);out.push(before,inside);const b=before.split(" ");if(b.length>=2)out.push(norm(inside+" "+b[b.length-1]));}return [...new Set(out.filter(Boolean))]}
function base(u){try{return decodeURIComponent((u||"").split("/").pop().split("?")[0].split("#")[0])}catch{return (u||"").split("/").pop().split("?")[0].split("#")[0]}}
function galleryBetween(doc,current,next){const all=[...doc.querySelectorAll("img")],out=[];for(const img of all){if(!/\.jpe?g$/i.test(base(img.closest("a")?.getAttribute("href")||img.getAttribute("src")||"")))continue;const beforeCurrent=current.compareDocumentPosition(img)&Node.DOCUMENT_POSITION_FOLLOWING;const beforeNext=next?(next.compareDocumentPosition(img)&Node.DOCUMENT_POSITION_FOLLOWING):false;if(beforeCurrent&&(!next||!beforeNext)){const cell=img.closest("td");let text="";if(cell)text=clean(cell.textContent);out.push({file:base(img.closest("a")?.getAttribute("href")||img.getAttribute("src")||""),name:text})}}return out}
function previousClassTable(allTables,studentIndex){for(let i=studentIndex-1;i>=0;i--){const text=clean(allTables[i].textContent);if(/Set Name\s*:?/i.test(text)&&/Teacher\s*:?/i.test(text))return allTables[i]}return null}
function classMeta(table){if(!table)return {};const text=clean(table.textContent),meta={};for(const [key,next] of [["setName","Teacher"],["teacher","Grade Group"],["gradeGroup","Linked Teachers"],["subject","Set Number"],["setCode","Set List"]]){const re=new RegExp(key==="setName"?"Set Name\\s*:?\\s*(.*?)(?=Teacher\\s*:|Grade Group\\s*:|Linked Teachers\\s*:|Subject\\s*:|Set Number\\s*:|Set Code\\s*:|$)":key==="teacher"?"Teacher\\s*:?\\s*(.*?)(?=Grade Group\\s*:|Linked Teachers\\s*:|Subject\\s*:|Set Number\\s*:|Set Code\\s*:|$)":key==="gradeGroup"?"Grade Group\\s*:?\\s*(.*?)(?=Linked Teachers\\s*:|Subject\\s*:|Set Number\\s*:|Set Code\\s*:|$)":key==="subject"?"Subject\\s*:?\\s*(.*?)(?=Set Number\\s*:|Set Name\\s*:|Set Code\\s*:|Set List|$)":"Set Code\\s*:?\\s*(.*?)(?=Set List|$)","i");const m=text.match(re);if(m)meta[key]=clean(m[1])}return meta}
function matchPhotos(students,gallery,images){const byFile=new Map(images.map(x=>[base(x.location).toLowerCase(),x])),used=new Set();let matched=0;for(const st of students){const wanted=[norm(st.preferred+" "+st.surname),norm(st.surname+" "+st.preferred)];let hit=null;for(const g of gallery){if(used.has(g.file))continue;const vars=nameVariants(g.name);if(wanted.some(w=>vars.includes(w))){hit=g;break}}if(hit){const im=byFile.get(hit.file.toLowerCase());if(im){st.image=im;used.add(hit.file);matched++}}}return {matched,found:gallery.length}}
function parseAll(mhtml){const doc=new DOMParser().parseFromString(mhtml.html,"text/html"),tables=[...doc.querySelectorAll("table")],students=[];for(let i=0;i<tables.length;i++)if(isStudentTable(tables[i]))students.push({table:tables[i],tableIndex:i});if(!students.length)throw Error("No iSAMS student tables found.");const classes=[];for(let i=0;i<students.length;i++){const cur=students[i],next=students[i+1],parsed=parseStudentTable(cur.table),meta=classMeta(previousClassTable(tables,cur.tableIndex)),gallery=galleryBetween(doc,cur.table,next?.table||null),photos=matchPhotos(parsed.students,gallery,mhtml.images);classes.push({meta,headers:parsed.headers,students:parsed.students,photos})}return {classes,imageCount:mhtml.images.length}}
function render(data){result.hidden=false;result.replaceChildren();const head=document.createElement("div");head.className="card";const h=document.createElement("h2");h.textContent=data.classes.length+" classes detected";head.appendChild(h);const p=document.createElement("p");p.className="muted";p.textContent=data.classes.reduce((n,c)=>n+c.students.length,0)+" students · "+data.imageCount+" embedded JPEGs";head.appendChild(p);result.appendChild(head);const list=document.createElement("div");list.className="classes";data.classes.forEach((c,i)=>{const card=document.createElement("div");card.className="class-card";const row=document.createElement("div");row.className="class-head";const cb=document.createElement("input");cb.type="checkbox";cb.checked=true;cb.dataset.index=i;row.appendChild(cb);const info=document.createElement("div");const n=document.createElement("div");n.className="class-name";n.textContent=c.meta.setName||"Unnamed class";info.appendChild(n);const d=document.createElement("div");d.className="muted";d.textContent=c.students.length+" students · "+c.photos.found+" photos in this class · "+c.photos.matched+" matched";info.appendChild(d);if(!c.meta.setName){const w=document.createElement("div");w.className="muted warn";w.textContent="Class name could not be identified.";info.appendChild(w)}row.appendChild(info);card.appendChild(row);const pills=document.createElement("div");c.headers.forEach(x=>{const s=document.createElement("span");s.className="pill";s.textContent=x;pills.appendChild(s)});card.appendChild(pills);list.appendChild(card)});result.appendChild(list);const actions=document.createElement("div");actions.className="actions";const b=document.createElement("button");b.type="button";b.className="button";b.textContent="Import selected classes";b.addEventListener("click",()=>{const count=list.querySelectorAll("input:checked").length;setStatus("Selected "+count+" classes. The next stage will save these into the class data model.","ok")});actions.appendChild(b);result.appendChild(actions)}
fileInput.addEventListener("change",async()=>{const f=fileInput.files?.[0];if(!f)return;setStatus("Reading "+f.name+"...");try{const raw=await f.text(),m=parseMhtml(raw),data=parseAll(m);render(data);setStatus("Import analysis complete - "+data.classes.length+" classes detected.","ok")}catch(e){console.error(e);setStatus("Import failed: "+e.message,"bad")}});
</script></body></html>
