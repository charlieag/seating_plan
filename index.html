<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seating Plan — Import Test</title><style>body{font-family:system-ui;margin:0;background:#f5f7fa;color:#18202a}main{max-width:900px;margin:auto;padding:32px 20px}.box{background:white;border:1px solid #ddd;border-radius:12px;padding:24px;margin:16px 0}button,label{display:inline-block;padding:11px 16px;border:1px solid #bbb;border-radius:8px;background:#fff;cursor:pointer}label{background:#285bd6;color:#fff;border-color:#285bd6}input{position:absolute;left:-9999px}.status{margin-top:16px;padding:12px;border-radius:8px;background:#eee}.ok{background:#e9f7ee;color:#17683a}.bad{background:#fff0f0;color:#9e2929}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd}.photo{width:55px;height:65px;object-fit:cover;border-radius:6px}.hidden{display:none}</style></head><body><main><h1>iSAMS Import Test</h1><p>This is Stage 1: local iSAMS report parsing. Files are processed in your browser and are not uploaded.</p><div class="box"><h2>1. Test the app</h2><button id="test" type="button">Run self-test</button><div id="status" class="status">JavaScript loaded: yes. Ready.</div></div><div class="box"><h2>2. Import an iSAMS report</h2><label for="file">Choose HTML / MHT / MHTML</label><input id="file" type="file" accept=".html,.htm,.mht,.mhtml,text/html,application/x-mimearchive"><div id="result" class="hidden"></div></div></main><script>
(function(){
  'use strict';
  var status=document.getElementById('status');
  var fileInput=document.getElementById('file');
  var result=document.getElementById('result');
  function setStatus(text,kind){status.textContent=text;status.className='status '+(kind||'');}
  function text(el){return (el&&el.textContent||'').replace(/\s+/g,' ').trim();}
  function headerKey(s){return text({textContent:s}).toLowerCase().replace(/:/g,'');}
  function findStudentTable(doc){
    var tables=Array.prototype.slice.call(doc.querySelectorAll('table'));
    for(var i=0;i<tables.length;i++){
      var rows=tables[i].querySelectorAll('tr');
      for(var r=0;r<rows.length;r++){
        var vals=Array.prototype.slice.call(rows[r].querySelectorAll('td,th')).map(text).map(headerKey);
        if(vals.indexOf('surname')!==-1 && vals.indexOf('preferred name')!==-1) return tables[i];
      }
    }
    return null;
  }
  function parseHtml(html){
    var doc=new DOMParser().parseFromString(html,'text/html');
    var table=findStudentTable(doc);
    if(!table) throw new Error('Could not find an iSAMS Set List table.');
    var rows=Array.prototype.slice.call(table.querySelectorAll('tr'));
    var headerRow=null, headers=[];
    for(var i=0;i<rows.length;i++){
      var h=Array.prototype.slice.call(rows[i].querySelectorAll('td,th')).map(text);
      var hk=h.map(headerKey);
      if(hk.indexOf('surname')!==-1 && hk.indexOf('preferred name')!==-1){headerRow=rows[i];headers=h;break;}
    }
    var students=[];
    if(headerRow){
      var start=rows.indexOf(headerRow)+1;
      for(var j=start;j<rows.length;j++){
        var cells=Array.prototype.slice.call(rows[j].querySelectorAll(':scope > td, :scope > th')).map(text);
        if(!cells.length) continue;
        var record={}; headers.forEach(function(h,k){record[h]=cells[k]||'';});
        var sn=record[headers[headerKey(headers).indexOf('surname')]];
        var pn=record[headers[headerKey(headers).indexOf('preferred name')]];
        if(sn||pn) students.push({name:[pn,sn].filter(Boolean).join(' '),fields:record});
      }
    }
    var meta={};
    Array.prototype.slice.call(doc.querySelectorAll('td')).forEach(function(td){
      var label=text(td).replace(/:$/,'').toLowerCase();
      if(['teacher','grade group','subject','set name','set code'].indexOf(label)>=0 && td.nextElementSibling) meta[label]=text(td.nextElementSibling);
    });
    return {doc:doc,headers:headers,students:students,meta:meta};
  }
  document.getElementById('test').addEventListener('click',function(){
    try{
      var fake='<!doctype html><html><body><table><tr><td>Surname</td><td>Preferred Name</td><td>Form</td></tr><tr><td>Test One</td><td>Alex</td><td>8A</td></tr><tr><td>Test Two</td><td>Sam</td><td>8B</td></tr></table></body></html>';
      var parsed=parseHtml(fake);
      if(parsed.students.length!==2) throw new Error('Expected 2 students, found '+parsed.students.length);
      setStatus('Self-test passed — JavaScript and basic HTML parsing are working.','ok');
    }catch(e){setStatus('Self-test failed: '+e.message,'bad');console.error(e);}
  });
  fileInput.addEventListener('change',function(){
    var file=fileInput.files && fileInput.files[0];
    if(!file) return;
    setStatus('Reading '+file.name+'…');
    file.text().then(function(raw){
      try{
        var isMhtml=/\.(mht|mhtml)$/i.test(file.name) || /Content-Type:\s*multipart\/related/i.test(raw);
        var html=raw;
        if(isMhtml){
          // Stage 1 browser smoke test: identify MHTML and locate the HTML MIME part.
          var boundaryMatch=raw.match(/boundary\s*=\s*(?:"([^"]+)"|([^;\r\n]+))/i);
          if(!boundaryMatch) throw new Error('MHTML detected, but no MIME boundary was found.');
          var boundary=boundaryMatch[1]||boundaryMatch[2].trim();
          var parts=raw.split('--'+boundary);
          var htmlFound=null;
          for(var p=0;p<parts.length;p++) if(/^\s*Content-Type:\s*text\/html/i.test(parts[p])){var sep=parts[p].search(/\r?\n\r?\n/);if(sep>=0) htmlFound=parts[p].slice(sep).replace(/^\r?\n\r?\n/,'');break;}
          if(!htmlFound) throw new Error('No text/html part found in MHTML.');
          html=htmlFound;
        }
        var parsed=parseHtml(html);
        result.className='box';
        result.innerHTML='<h2>Import result</h2><p><strong>'+parsed.students.length+'</strong> students found.</p><p><strong>'+parsed.headers.length+'</strong> fields detected: '+parsed.headers.map(function(x){return '<code>'+x.replace(/[&<>]/g,'')+'</code>';}).join(', ')+'</p><p>Report: '+(parsed.meta['set name']||'not detected')+'</p><table><thead><tr><th>Name</th>'+parsed.headers.map(function(h){return '<th>'+h.replace(/[&<>]/g,'')+'</th>';}).join('')+'</tr></thead><tbody>'+parsed.students.map(function(s){return '<tr><td>'+s.name.replace(/[&<>]/g,'')+'</td>'+parsed.headers.map(function(h){return '<td>'+String(s.fields[h]||'').replace(/[&<>]/g,'')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table>';
        setStatus('Import parsed successfully.','ok');
      }catch(e){setStatus('Import failed: '+e.message,'bad');console.error(e);}
    }).catch(function(e){setStatus('Could not read the file: '+e.message,'bad');});
  });
})();
</script></body></html>
