<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seating Plan — iSAMS Import Test</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#f5f7fa}
*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:32px 20px 56px}h1{margin:0 0 8px;font-size:28px}.lede{margin:0 0 24px;color:#657181;line-height:1.5}.panel{background:#fff;border:1px solid #d9dee7;border-radius:14px;padding:20px;margin-bottom:16px}h2{font-size:18px;margin:0 0 12px}.drop{border:2px dashed #b9c2ce;border-radius:12px;padding:28px;text-align:center;background:#fafbfc}.drop.over{border-color:#285bd6;background:#f1f5ff}.muted{color:#6b7685}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}.btn{appearance:none;border:1px solid #cfd5de;background:#fff;border-radius:9px;padding:11px 16px;min-height:44px;font:inherit;cursor:pointer}.btn.primary{background:#285bd6;color:white;border-color:#285bd6}.btn:focus-visible{outline:3px solid #aabfff;outline-offset:2px}input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.status{margin-top:12px;padding:11px 13px;border-radius:9px;background:#f0f2f5;color:#667180}.status.ok{background:#ecf8f0;color:#17683a}.status.warn{background:#fff7e7;color:#835800}.status.bad{background:#fff0f0;color:#9e2929}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.meta{border:1px solid #dde2e9;border-radius:10px;padding:12px}.meta small{display:block;color:#697584;margin-bottom:4px}.meta strong{overflow-wrap:anywhere}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #d9dee7;border-radius:999px;padding:5px 9px;font-size:13px;background:#fbfcfd}.tablewrap{overflow:auto;border:1px solid #d9dee7;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:9px 10px;border-bottom:1px solid #e2e6ec;text-align:left;vertical-align:top}th{background:#f7f8fa;font-size:13px}tr:last-child td{border-bottom:0}.photo{width:52px;height:64px;object-fit:cover;border:1px solid #d9dee7;border-radius:7px;background:#eef1f4;display:block}.hidden{display:none}.diag{white-space:pre-wrap;background:#10151c;color:#e5edf7;padding:14px;border-radius:10px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}@media(max-width:600px){main{padding:22px 14px 40px}.panel{padding:16px}}
</style>
</head>
<body>
<main>
<h1>iSAMS Import Test</h1>
<p class="lede">Stage 1 only: read an iSAMS HTML/MHTML report locally and turn it into structured student records. No student data is uploaded.</p>
<section class="panel">
<h2>Import an iSAMS report</h2>
<div id="drop" class="drop">
<div><strong>Choose an iSAMS report</strong></div>
<div class="muted" style="margin-top:6px">HTML, MHT or MHTML</div>
<div class="actions"><label class="btn primary" for="file">Choose file</label><button class="btn" id="selfTest" type="button">Run self-test</button></div>
<input id="file" type="file" accept=".html,.htm,.mht,.mhtml,text/html,application/x-mimearchive">
<div id="status" class="status" aria-live="polite">No file loaded.</div>
</div>
</section>
<section id="summary" class="panel hidden"><h2>Report</h2><div id="meta" class="grid"></div></section>
<section id="fieldPanel" class="panel hidden"><h2>Detected fields</h2><div id="fields" class="chips"></div></section>
<section id="studentPanel" class="panel hidden"><h2>Students</h2><div id="studentSummary" class="muted" style="margin-bottom:12px"></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section>
<section id="diagPanel" class="panel hidden"><h2>Diagnostics</h2><div id="diag" class="diag"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);
const cleanText=v=>String(v??'').replace(/\s+/g,' ').replace(/\u00a0/g,' ').trim();
const normaliseHeader=v=>cleanText(v).toLowerCase().replace(/:/g,'');
const normaliseName=v=>cleanText(v).toLowerCase().replace(/[^\p{L}\p{N}]+/gu,' ').trim();
const escapeHtml=v=>String(v??'').replace(/[&<>\'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]));
function decodeQuotedPrintable(input){return input.replace(/=\r?\n/g,'').replace(/=([0-9A-Fa-f]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)));}
function base64ToBytes(value){const b=atob(value.replace(/\s+/g,''));const out=new Uint8Array(b.length);for(let i=0;i<b.length;i++)out[i]=b.charCodeAt(i);return out;}
function splitMhtml(raw){const headerEnd=raw.search(/\r?\n\r?\n/);if(headerEnd<0)throw Error('The MHTML file has no MIME header.');const header=raw.slice(0,headerEnd);const bm=header.match(/boundary\s*=\s*(?:"([^"]+)"|([^;\r\n]+))/i);if(!bm)throw Error('Could not find the MHTML MIME boundary.');const boundary=bm[1]||bm[2].trim();const marker='--'+boundary;const chunks=raw.split(marker).slice(1);const parts=[];for(let chunk of chunks){chunk=chunk.replace(/^\r?\n/,'').replace(/\r?\n--\s*$/,'').replace(/^--\r?\n?$/,'');if(!chunk.trim())continue;const sep=chunk.search(/\r?\n\r?\n/);if(sep<0)continue;const h=chunk.slice(0,sep);const body=chunk.slice(sep).replace(/^\r?\n\r?\n/,'');const headers={};for(const line of h.split(/\r?\n/)){const m=line.match(/^([^:]+):\s*(.*)$/);if(m)headers[m[1].toLowerCase()]=m[2];}parts.push({headers,body});}return parts;}
function parseMhtml(raw){const parts=splitMhtml(raw);const hp=parts.find(p=>(p.headers['content-type']||'').toLowerCase().startsWith('text/html'));if(!hp)throw Error('No text/html part was found in the MHTML file.');let html=hp.body;if((hp.headers['content-transfer-encoding']||'').toLowerCase().includes('quoted-printable'))html=decodeQuotedPrintable(html);const images=new Map();for(const p of parts){const type=(p.headers['content-type']||'').split(';')[0].trim().toLowerCase();if(!type.startsWith('image/'))continue;let bytes;const enc=(p.headers['content-transfer-encoding']||'').toLowerCase();if(enc==='base64')bytes=base64ToBytes(p.body);else if(enc==='quoted-printable')bytes=new TextEncoder().encode(decodeQuotedPrintable(p.body));else bytes=new TextEncoder().encode(p.body);const loc=p.headers['content-location'];if(loc)images.set(loc,{type,bytes});}return{html,images,parts:parts.length};}
function parseDoc(html){const d=new DOMParser().parseFromString(html,'text/html');if(!d.body)throw Error('The HTML report could not be parsed.');return d;}
const textOf=el=>cleanText(el?.textContent||'');
function findSetTable(doc){const tables=[...doc.querySelectorAll('table')];return tables.find(t=>{const h=[...t.querySelectorAll('tr:first-child th, tr:first-child td')].map(textOf).map(normaliseHeader);return h.includes('surname')&&h.includes('preferred name');})||tables.find(t=>/surname/i.test(textOf(t))&&/preferred name/i.test(textOf(t)));}
function extractMeta(doc){const meta={};const labels=['Teacher','Grade Group','Subject','Set Name','Set Code','Set Number','Linked Teachers'];const cells=[...doc.querySelectorAll('td')];for(const label of labels){const cell=cells.find(td=>new RegExp('^\\s*'+label+'\\s*:\\s*$','i').test(textOf(td)));if(cell?.nextElementSibling)meta[label]=textOf(cell.nextElementSibling);}meta.title=[...doc.querySelectorAll('h1,h2,h3,h4,b,strong')].map(textOf).find(t=>/^Set Profile/i.test(t))||textOf(doc.querySelector('title'))||'';return meta;}
function extractStudents(doc){const table=findSetTable(doc);if(!table)throw Error('Could not find the Set List table. It should contain Surname and Preferred Name headers.');const rows=[...table.querySelectorAll('tr')];const headerRow=rows.find(r=>{const h=[...r.querySelectorAll('th,td')].map(textOf).map(normaliseHeader);return h.includes('surname')&&h.includes('preferred name');});if(!headerRow)throw Error('Could not identify the student table headers.');const headers=[...headerRow.querySelectorAll('th,td')].map(textOf);const students=[];const start=rows.indexOf(headerRow)+1;for(const row of rows.slice(start)){const cells=[...row.querySelectorAll(':scope > td, :scope > th')];if(!cells.length)continue;const values=cells.map(textOf);const record={};headers.forEach((h,i)=>record[h]=values[i]??'');const sh=headers.find(h=>normaliseHeader(h)==='surname');const ph=headers.find(h=>normaliseHeader(h)==='preferred name');if(!record[sh]&&!record[ph])continue;students.push({fields:record,name:[record[ph],record[sh]].filter(Boolean).join(' '),photo:null});}return{headers,students};}
function extractPhotos(doc,images){const photos=[];for(const img of doc.querySelectorAll('img')){const src=img.getAttribute('src')||img.getAttribute('data-src');if(!src)continue;const link=img.closest('a');const href=link?.getAttribute('href')||src;if(!/\.(jpe?g|png|gif)(?:$|\?)/i.test(href)&&!/\.(jpe?g|png|gif)(?:$|\?)/i.test(src))continue;const block=img.parentElement?.parentElement||img.parentElement;const nameText=textOf(block).replace(textOf(img),'').trim();const filename=href.split('/').pop().split('?')[0];let embedded=null;if(images){for(const[location,image]of images){if(location.split('/').pop()===filename){embedded=image;break;}}}photos.push({filename,src,href,text:nameText,embedded});}return photos;}
function imageDataUrl(image){if(!image)return null;let binary='';const bytes=image.bytes;for(let i=0;i<bytes.length;i+=0x8000)binary+=String.fromCharCode(...bytes.subarray(i,Math.min(i+0x8000,bytes.length)));return `data:${image.type};base64,${btoa(binary)}`;}
function associate(students,photos){const remaining=[...photos];for(const s of students){const target=normaliseName(s.name);const idx=remaining.findIndex(p=>{const n=normaliseName(p.text);return n&&(n.includes(target)||target.includes(n));});if(idx>=0){s.photo=remaining.splice(idx,1)[0];}}return remaining;}
async function parseFile(file){const raw=await file.text();const isMhtml=/\.(mht|mhtml)$/i.test(file.name)||(/^From:\s/m.test(raw)&&/Content-Type:\s*multipart\/related/i.test(raw));let html=raw,images=new Map(),parts=0;if(isMhtml){const p=parseMhtml(raw);html=p.html;images=p.images;parts=p.parts;}const doc=parseDoc(html);const meta=extractMeta(doc);const {headers,students}=extractStudents(doc);const photos=extractPhotos(doc,isMhtml?images:null);const unmatched=associate(students,photos);return{isMhtml,meta,headers,students,photos,unmatchedPhotos:unmatched,embeddedImages:images.size,parts};}
function render(r){$('summary').classList.remove('hidden');$('fieldPanel').classList.remove('hidden');$('studentPanel').classList.remove('hidden');const meta=[['Report',r.meta.title],['Teacher',r.meta.Teacher],['Subject',r.meta.Subject],['Set',r.meta['Set Name']||r.meta['Set Code']],['Students',r.students.length],['Format',r.isMhtml?`MHTML (${r.embeddedImages} embedded images)`:'HTML']];$('meta').innerHTML=meta.map(([k,v])=>`<div class="meta"><small>${escapeHtml(k)}</small><strong>${escapeHtml(v??'Not found')}</strong></div>`).join('');$('fields').innerHTML=r.headers.map(h=>`<span class="chip">${escapeHtml(h)}</span>`).join('');const matched=r.students.filter(s=>s.photo).length;$('studentSummary').textContent=`${r.students.length} students found · ${matched} photos matched`;$('thead').innerHTML=`<tr><th>Photo</th>${r.headers.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr>`;$('tbody').innerHTML=r.students.map(s=>`<tr><td>${s.photo?.embedded?`<img class="photo" src="${imageDataUrl(s.photo.embedded)}" alt="">`:'<span class="muted">—</span>'}</td>${r.headers.map(h=>`<td>${escapeHtml(s.fields[h]||'')}</td>`).join('')}</tr>`).join('');$('diagPanel').classList.remove('hidden');$('diag').textContent=JSON.stringify({format:r.isMhtml?'MHTML':'HTML',mimeParts:r.parts||undefined,embeddedImages:r.embeddedImages||0,detectedFields:r.headers,studentCount:r.students.length,photoGalleryCount:r.photos.length,matchedPhotoCount:matched,unmatchedPhotoCount:r.unmatchedPhotos.length},null,2);}
async function loadFile(file){$('status').className='status';$('status').textContent=`Reading ${file.name}…`;try{const r=await parseFile(file);render(r);$('status').className=`status ${r.unmatchedPhotos.length?'warn':'ok'}`;$('status').textContent=r.unmatchedPhotos.length?`Imported ${r.students.length} students; ${r.unmatchedPhotos.length} photo(s) could not be matched.`:`Successfully imported ${r.students.length} students and matched all detected photos.`;}catch(e){console.error(e);$('status').className='status bad';$('status').textContent=e.message||'Import failed.';}}
$('file').addEventListener('change',e=>{if(e.target.files[0])loadFile(e.target.files[0]);});
$('drop').addEventListener('dragover',e=>{e.preventDefault();$('drop').classList.add('over');});$('drop').addEventListener('dragleave',()=>$('drop').classList.remove('over'));$('drop').addEventListener('drop',e=>{e.preventDefault();$('drop').classList.remove('over');if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0]);});
$('selfTest').addEventListener('click',()=>{const fake=`<!doctype html><html><body><h3>Set Profile - Test Class</h3><table><tr><td><b>Teacher:</b></td><td>Test Teacher</td></tr><tr><td><b>Subject:</b></td><td>Mathematics</td></tr><tr><td><b>Set Name:</b></td><td>Y8 TEST</td></tr></table><table><tr><td></td><td>Surname</td><td>Preferred Name</td><td>Form</td><td>Gender</td></tr><tr><td>1.</td><td>Student One</td><td>Alex</td><td>8A</td><td>M</td></tr><tr><td>2.</td><td>Student Two</td><td>Sam</td><td>8A</td><td>F</td></tr></table></body></html>`;try{const d=parseDoc(fake);const{x,students}=(()=>{const z=extractStudents(d);return{...z}})();const meta=extractMeta(d);const ok=x?.includes('Surname')&&students.length===2&&meta.Subject==='Mathematics';$('diagPanel').classList.remove('hidden');$('diag').textContent=ok?'PASS — synthetic HTML parser test found the expected class, fields and 2 students.':JSON.stringify({headers:x,students,meta},null,2);$('status').className=`status ${ok?'ok':'bad'}`;$('status').textContent=ok?'Self-test passed.':'Self-test failed — see diagnostics.';}catch(e){$('status').className='status bad';$('status').textContent=`Self-test failed: ${e.message}`;}});
</script>
</body></html>
