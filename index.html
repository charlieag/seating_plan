<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seating Plan - Stage 1</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#18202a}main{max-width:1100px;margin:auto;padding:32px 20px}section{background:#fff;border:1px solid #d8dee6;border-radius:12px;padding:22px;margin-bottom:16px}button,label{font:inherit;padding:11px 16px;border-radius:8px;border:1px solid #bcc5d1;background:#fff;cursor:pointer;display:inline-block}label{background:#285bd6;color:#fff;border-color:#285bd6}input[type=file]{position:absolute;left:-9999px}.status{padding:12px;margin-top:14px;border-radius:8px;background:#eef1f5}.ok{background:#e9f7ee;color:#17683a}.bad{background:#fff0f0;color:#9e2929}.hidden{display:none}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{text-align:left;padding:8px;border-bottom:1px solid #dde2e8}.fields{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.field{padding:4px 8px;border-radius:999px;background:#f0f2f5;border:1px solid #d8dee6;font-size:13px}.version{font-size:12px;color:#687381}
</style>
</head>
<body>
<main>
<section>
<h1>iSAMS Seating Planner</h1>
<p>Stage 1: local HTML import test.</p>
<p class="version">Build 0.1.7</p>
<p><strong>JavaScript:</strong> <span id="jsStatus">loading...</span></p>
<button id="selfTest" type="button">Run self-test</button>
<div id="status" class="status">Ready.</div>
</section>
<section>
<h2>Import iSAMS HTML</h2>
<p>Choose the anonymised HTML export. MHTML and photos come next.</p>
<label for="fileInput">Choose file</label>
<input id="fileInput" type="file" accept=".html,.htm">
</section>
<section id="result" class="hidden"></section>
</main>
<script>
(function(){
"use strict";
var jsStatus=document.getElementById("jsStatus");
var statusBox=document.getElementById("status");
var fileInput=document.getElementById("fileInput");
var result=document.getElementById("result");
jsStatus.textContent="loaded";
function cleanText(node){if(node===null||node===undefined)return "";var value=(typeof node==="string")?node:(node.textContent||"");return value.replace(/\u00a0/g," ").replace(/\s+/g," ").trim();}
function normalise(value){return cleanText(value).toLowerCase().replace(/:/g,"");}
function directCells(row){var out=[];for(var i=0;i<row.children.length;i++){var el=row.children[i];if(el.tagName==='TD'||el.tagName==='TH')out.push(el);}return out;}
function directRows(table){var out=[];for(var i=0;i<table.children.length;i++){var child=table.children[i];if(child.tagName==='TR')out.push(child);else if(child.tagName==='TBODY'||child.tagName==='THEAD'||child.tagName==='TFOOT'){for(var j=0;j<child.children.length;j++){var row=child.children[j];if(row.tagName==='TR')out.push(row);}}}return out;}
function findStudentHeader(){
 var tables=document.getElementsByTagName("table");
 for(var i=0;i<tables.length;i++){
   var rows=directRows(tables[i]);
   for(var r=0;r<rows.length;r++){
     var cells=directCells(rows[r]);
     var hasSurname=false,hasPreferred=false;
     for(var c=0;c<cells.length;c++){var v=normalise(cells[c]);if(v==="surname")hasSurname=true;if(v==="preferred name")hasPreferred=true;}
     if(hasSurname&&hasPreferred)return {table:tables[i],row:rows[r]};
   }
 }
 return null;
}
function parseReport(raw){
 var doc=new DOMParser().parseFromString(raw,"text/html");
 var found=findStudentHeader();
 if(!found)throw new Error("Could not find the iSAMS student table. No direct row contained both Surname and Preferred Name.");
 var rows=directRows(found.table);var headerRow=found.row;var headerCells=directCells(headerRow);var headers=headerCells.map(cleanText);
 var lowerHeaders=headers.map(normalise);var surnameIndex=lowerHeaders.indexOf("surname");var preferredIndex=lowerHeaders.indexOf("preferred name");var students=[];
 var start=rows.indexOf(headerRow)+1;
 for(var r=start;r<rows.length;r++){
   var cells=directCells(rows[r]);if(!cells.length)continue;var values=cells.map(cleanText);var record={};for(var h=0;h<headers.length;h++)record[headers[h]]=values[h]||"";
   var surname=values[surnameIndex]||"";var preferred=values[preferredIndex]||"";if(surname||preferred)students.push({name:[preferred,surname].filter(Boolean).join(" "),fields:record});
 }
 var meta={};var allCells=document.getElementsByTagName("td");for(var m=0;m<allCells.length;m++){var key=normalise(allCells[m]);if(["teacher","grade group","subject","set name","set code"].indexOf(key)!==-1&&allCells[m].nextElementSibling)meta[key]=cleanText(allCells[m].nextElementSibling);}
 return {headers:headers,students:students,meta:meta};
}
function render(parsed,fileName){result.className="";result.innerHTML="";var h=document.createElement("h2");h.textContent="Parsed: "+fileName;result.appendChild(h);var p=document.createElement("p");p.textContent=(parsed.meta["set name"]||"Set not detected")+" - "+parsed.students.length+" students found.";result.appendChild(p);var strong=document.createElement("strong");strong.textContent="Detected fields";result.appendChild(strong);var fields=document.createElement("div");fields.className="fields";parsed.headers.forEach(function(header){var span=document.createElement("span");span.className="field";span.textContent=header;fields.appendChild(span);});result.appendChild(fields);var table=document.createElement("table"),thead=document.createElement("thead"),tr=document.createElement("tr");["Name"].concat(parsed.headers).forEach(function(header){var th=document.createElement("th");th.textContent=header;tr.appendChild(th);});thead.appendChild(tr);table.appendChild(thead);var tbody=document.createElement("tbody");parsed.students.forEach(function(student){var row=document.createElement("tr");var name=document.createElement("td");name.textContent=student.name;row.appendChild(name);parsed.headers.forEach(function(header){var td=document.createElement("td");td.textContent=student.fields[header]||"";row.appendChild(td);});tbody.appendChild(row);});table.appendChild(tbody);result.appendChild(table);}
document.getElementById("selfTest").addEventListener("click",function(){try{var fake="<html><body><table><tbody><tr><td>Surname</td><td>Preferred Name</td><td>Form</td></tr><tr><td>One</td><td>Alex</td><td>8A</td></tr><tr><td>Two</td><td>Sam</td><td>8B</td></tr></tbody></table></body></html>";var parsed=parseReport(fake);if(parsed.students.length!==2)throw new Error("Expected 2 students but found "+parsed.students.length+".");setStatus("Self-test passed. HTML table parsing is working.","ok");}catch(e){console.error(e);setStatus("Self-test failed: "+e.message,"bad");}});
function setStatus(message,kind){statusBox.textContent=message;statusBox.className="status"+(kind?" "+kind:"");}
fileInput.addEventListener("change",function(){var file=fileInput.files&&fileInput.files[0];if(!file)return;setStatus("Reading "+file.name+"...");var reader=new FileReader();reader.onload=function(){try{var parsed=parseReport(String(reader.result||""));render(parsed,file.name);setStatus("Import successful - "+parsed.students.length+" students found.","ok");}catch(error){console.error(error);setStatus("Import failed: "+error.message,"bad");}};reader.onerror=function(){setStatus("The browser could not read that file.","bad");};reader.readAsText(file);});
})();
</script>
</body></html>
