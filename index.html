<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Seating Plan - Stage 1 Import Test</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f5f7fa;color:#18202a}main{max-width:900px;margin:auto;padding:32px 20px}.card{background:#fff;border:1px solid #d9dee7;border-radius:12px;padding:24px;margin-bottom:16px}button,label{font:inherit;padding:11px 16px;border:1px solid #bcc5d1;border-radius:8px;background:#fff;cursor:pointer;display:inline-block}label{background:#285bd6;color:#fff;border-color:#285bd6}input[type=file]{position:absolute;left:-9999px;width:1px;height:1px}.status{margin-top:16px;padding:12px;border-radius:8px;background:#eef1f5}.ok{background:#e9f7ee;color:#17683a}.bad{background:#fff0f0;color:#9e2929}.hidden{display:none}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid #ddd;vertical-align:top}.small{color:#697584;font-size:14px}.fields{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.field{background:#f0f2f5;border:1px solid #d9dee7;border-radius:999px;padding:4px 8px;font-size:13px}
</style>
</head>
<body>
<main>
<div class="card">
<h1>iSAMS Seating Planner</h1>
<p>Stage 1: prove the browser can read an iSAMS report locally.</p>
<p><strong>JavaScript:</strong> <span id="jsStatus">loading...</span></p>
<button id="selfTest" type="button">Run self-test</button>
</div>
<div class="card">
<h2>Import report</h2>
<p class="small">Choose an iSAMS HTML, MHT or MHTML file. The file is read only in this browser.</p>
<label for="fileInput">Choose iSAMS file</label>
<input id="fileInput" type="file" accept=".html,.htm,.mht,.mhtml">
<div id="status" class="status">No file selected.</div>
</div>
<div id="result" class="card hidden"></div>
</main>
<script>
"use strict";
var jsStatus=document.getElementById("jsStatus");
var statusBox=document.getElementById("status");
var resultBox=document.getElementById("result");
var fileInput=document.getElementById("fileInput");
jsStatus.textContent="loaded";
function clean(value){return String(value||"").replace(/\s+/g," ").replace(/\u00a0/g," ").trim();}
function cellText(el){return clean(el && el.textContent);}
function setStatus(message,ok){statusBox.textContent=message;statusBox.className="status"+(ok===true?" ok":ok===false?" bad":"");}
function parseHtmlReport(raw){
  var doc=new DOMParser().parseFromString(raw,"text/html");
  var tables=Array.prototype.slice.call(doc.querySelectorAll("table"));
  var table=null,headerRow=null,headers=[];
  for(var i=0;i<tables.length && !table;i++){
    var rows=Array.prototype.slice.call(tables[i].querySelectorAll("tr"));
    for(var r=0;r<rows.length;r++){
      var cells=Array.prototype.slice.call(rows[r].querySelectorAll("td,th"));
      var candidate=cells.map(cellText);
      var lower=candidate.map(function(v){return v.toLowerCase();});
      if(lower.indexOf("surname")!==-1 && lower.indexOf("preferred name")!==-1){table=tables[i];headerRow=rows[r];headers=candidate;break;}
    }
  }
  if(!table||!headerRow)throw new Error("Could not find the iSAMS student table.");
  var rows=Array.prototype.slice.call(table.querySelectorAll("tr"));
  var students=[];
  var headerLower=headers.map(function(v){return v.toLowerCase();});
  var surnameIndex=headerLower.indexOf("surname");
  var preferredIndex=headerLower.indexOf("preferred name");
  for(var j=rows.indexOf(headerRow)+1;j<rows.length;j++){
    var rowCells=Array.prototype.slice.call(rows[j].children).filter(function(el){return el.tagName==='TD'||el.tagName==='TH';});
    var values=rowCells.map(cellText);if(!values.length)continue;
    var record={};for(var c=0;c<headers.length;c++)record[headers[c]]=values[c]||"";
    var surname=record[headers[surnameIndex]]||"";var preferred=record[headers[preferredIndex]]||"";
    if(surname||preferred)students.push({name:[preferred,surname].filter(Boolean).join(" "),fields:record});
  }
  var meta={};
  Array.prototype.slice.call(doc.querySelectorAll("td")).forEach(function(td){
    var key=cellText(td).replace(/:$/g,"").toLowerCase();
    if(["teacher","grade group","subject","set name","set code"].indexOf(key)!==-1&&td.nextElementSibling)meta[key]=cellText(td.nextElementSibling);
  });
  return{headers:headers,students:students,meta:meta};
}
function render(parsed,fileName){
  resultBox.className="card";resultBox.innerHTML="";
  var h=document.createElement("h2");h.textContent="Parsed: "+fileName;resultBox.appendChild(h);
  var p=document.createElement("p");p.textContent=(parsed.meta["set name"]||"Set not detected")+" - "+parsed.students.length+" students";resultBox.appendChild(p);
  var strong=document.createElement("strong");strong.textContent="Detected fields";resultBox.appendChild(strong);
  var fields=document.createElement("div");fields.className="fields";parsed.headers.forEach(function(x){var s=document.createElement("span");s.className="field";s.textContent=x;fields.appendChild(s)});resultBox.appendChild(fields);
  var table=document.createElement("table"),thead=document.createElement("thead"),tr=document.createElement("tr");
  ["Name"].concat(parsed.headers).forEach(function(h){var th=document.createElement("th");th.textContent=h;tr.appendChild(th)});thead.appendChild(tr);table.appendChild(thead);
  var tbody=document.createElement("tbody");parsed.students.forEach(function(st){var row=document.createElement("tr");var nc=document.createElement("td");nc.textContent=st.name;row.appendChild(nc);parsed.headers.forEach(function(h){var td=document.createElement("td");td.textContent=st.fields[h]||"";row.appendChild(td)});tbody.appendChild(row)});table.appendChild(tbody);resultBox.appendChild(table);
}
document.getElementById("selfTest").addEventListener("click",function(){try{var fake='<!doctype html><html><body><table><tr><td>Surname</td><td>Preferred Name</td><td>Form</td></tr><tr><td>One</td><td>Alex</td><td>8A</td></tr><tr><td>Two</td><td>Sam</td><td>8B</td></tr></table></body></html>';var p=parseHtmlReport(fake);if(p.students.length!==2)throw new Error("Expected 2 students, found "+p.students.length);setStatus("Self-test passed - HTML parsing is working.",true)}catch(e){console.error(e);setStatus("Self-test failed: "+e.message,false)}});
fileInput.addEventListener("change",function(){var file=fileInput.files&&fileInput.files[0];if(!file)return;setStatus("Reading "+file.name+"...");var reader=new FileReader();reader.onload=function(){try{var raw=String(reader.result||"");if(/\.(mht|mhtml)$/i.test(file.name)||/Content-Type:\s*multipart\/related/i.test(raw)){throw new Error("MHTML support is not enabled in this test yet. Please use the HTML export first.")}var p=parseHtmlReport(raw);render(p,file.name);setStatus("Import successful - "+p.students.length+" students found.",true)}catch(e){console.error(e);setStatus("Import failed: "+e.message,false)}};reader.onerror=function(){setStatus("The browser could not read that file.",false)};reader.readAsText(file)});
</script>
</body></html>
