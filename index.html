<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seating Plan — iSAMS Import Test</title>
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#18202a;background:#f5f7fa}
*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:32px 20px 56px}h1{margin:0 0 8px;font-size:28px}.lede{margin:0 0 24px;color:#657181;line-height:1.5}.panel{background:#fff;border:1px solid #d9dee7;border-radius:14px;padding:20px;margin-bottom:16px}h2{font-size:18px;margin:0 0 12px}.drop{border:2px dashed #b9c2ce;border-radius:12px;padding:28px;text-align:center;background:#fafbfc}.drop.over{border-color:#285bd6;background:#f1f5ff}.muted{color:#6b7685}.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:14px}.btn{appearance:none;border:1px solid #cfd5de;background:#fff;border-radius:9px;padding:11px 16px;min-height:44px;font:inherit;cursor:pointer}.btn.primary{background:#285bd6;color:white;border-color:#285bd6}.btn:focus-visible{outline:3px solid #aabfff;outline-offset:2px}input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}.status{margin-top:12px;padding:11px 13px;border-radius:9px;background:#f0f2f5;color:#667180}.status.ok{background:#ecf8f0;color:#17683a}.status.warn{background:#fff7e7;color:#835800}.status.bad{background:#fff0f0;color:#9e2929}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.meta{border:1px solid #dde2e9;border-radius:10px;padding:12px}.meta small{display:block;color:#697584;margin-bottom:4px}.meta strong{overflow-wrap:anywhere}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{border:1px solid #d9dee7;border-radius:999px;padding:5px 9px;font-size:13px;background:#fbfcfd}.tablewrap{overflow:auto;border:1px solid #d9dee7;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:760px}th,td{padding:9px 10px;border-bottom:1px solid #e2e6ec;text-align:left;vertical-align:top}th{background:#f7f8fa;font-size:13px}tr:last-child td{border-bottom:0}.photo{width:52px;height:64px;object-fit:cover;border:1px solid #d9dee7;border-radius:7px;background:#eef1f4;display:block}.hidden{display:none}.diag{white-space:pre-wrap;background:#10151c;color:#e5edf7;padding:14px;border-radius:10px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;overflow:auto}@media(max-width:600px){main{padding:22px 14px 40px}.panel{padding:16px}}
</style>
</head>
<body>
<main>
<h1>iSAMS Import Test</h1>
<p class="lede">Stage 1 only: read an iSAMS HTML/MHTML report locally and turn it into structured student records. No student data is uploaded.</p>
<section class="panel">
<h2>Import an iSAMS report</h2>
<div id="drop" class="drop">
<div><strong>Choose an iSAMS report</strong></div>
<div class="muted" style="margin-top:6px">HTML, MHT or MHTML</div>
<div class="actions"><label class="btn primary" for="file">Choose file</label><button class="btn" id="selfTest" type="button">Run self-test</button></div>
<input id="file" type="file" accept=".html,.htm,.mht,.mhtml,text/html,application/x-mimearchive">
<div id="status" class="status" aria-live="polite">No file loaded.</div>
</div>
</section>
<section id="summary" class="panel hidden"><h2>Report</h2><div id="meta" class="grid"></div></section>
<section id="fieldPanel" class="panel hidden"><h2>Detected fields</h2><div id="fields" class="chips"></div></section>
<section id="studentPanel" class="panel hidden"><h2>Students</h2><div id="studentSummary" class="muted" style="margin-bottom:12px"></div><div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section>
<section id="diagPanel" class="panel hidden"><h2>Diagnostics</h2><div id="diag" class="diag"></div></section>
</main>
<script src="app.js"></script>
</body></html>
