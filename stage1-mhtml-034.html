<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iSAMS Seating Planner - MHTML Import Test</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fa;color:#18202a}
main{max-width:1200px;margin:auto;padding:32px 20px}
.card{background:#fff;border:1px solid #d8dee6;border-radius:12px;padding:22px;margin-bottom:16px}
.file-label{font:inherit;padding:11px 16px;border-radius:8px;border:1px solid #285bd6;background:#285bd6;color:#fff;cursor:pointer;display:inline-block}
input[type=file]{position:absolute;left:-9999px;width:1px;height:1px}
.status{padding:12px;margin-top:14px;border-radius:8px;background:#eef1f5}.ok{background:#eaf7ef;color:#17683a}.bad{background:#fff0f0;color:#9e2929}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.metric{border:1px solid #dde2e8;border-radius:10px;padding:12px}.metric small{display:block;color:#697584;margin-bottom:4px}.metric strong{font-size:20px}
.fields{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.field{padding:5px 9px;border-radius:999px;background:#f0f2f5;border:1px solid #d8dee2;font-size:13px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:12px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid #dde2e8;vertical-align:middle}th{font-size:13px;background:#f8f9fb;white-space:nowrap}
.student-photo{width:64px;height:80px;object-fit:cover;border:1px solid #d8dee8;border-radius:7px;background:#eef1f4;display:block}.note{color:#697584;font-size:13px}.version{color:#697584;font-size:12px}
</style>
</head>
<body>
<main>
<div class="card">
<h1>iSAMS Seating Planner</h1>
<p><strong>Stage 1B — MHTML importer</strong></p>
<p class="version">Build 0.3.4</p>
<p class="note">Reads the MHTML entirely in this browser. Nothing is uploaded.</p>
<label class="file-label" for="file">Choose iSAMS MHTML</label>
<input id="file" type="file">
<div id="status" class="status">Ready.</div>
</div>
<div id="result" class="card" hidden></div>
</main>
<script>
"use strict";
const fileInput=document.getElementById("file");
const statusBox=document.getElementById("status");
const result=document.getElementById("result");
function setStatus(message,kind){statusBox.textContent=message;statusBox.className="status"+(kind?" "+kind:"");}
function clean(value){
  if(value===null||value===undefined)return "";
  const text=typeof value==="string"?value:(typeof value.textContent==="string"?value.textContent:String(value));
  return text.replace(/\u00a0/g," ").replace(/\s+/g," ").trim();
}
function unquotePrintable(s){return s.replace(/=\r?\n/g,"").replace(/=([0-9A-Fa-f]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)));}
function decodeBase64(s){
  const compact=s.replace(/[\r\n\t ]/g,"");
  const bin=atob(compact);const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return bytes;
}
function parseHeaders(block){
  const lines=block.replace(/\r\n/g,"\n").split("\n");const out={};let current="";
  for(const line of lines){
    if(/^[ \t]/.test(line)&&current){out[current]+=" "+line.trim();continue;}
    const match=line.match(/^([^:]+):\s*(.*)$/);if(match){current=match[1].toLowerCase();out[current]=match[2].trim();}
  }
  return out;
}
function parseMhtml(raw){
  const headEnd=raw.search(/\r?\n\r?\n/);if(headEnd<0)throw new Error("Invalid MHTML: MIME headers not found.");
  const top=parseHeaders(raw.slice(0,headEnd));
  const boundaryMatch=(top["content-type"]||"").match(/boundary\s*=\s*(?:"([^"]+)"|([^;]+))/i);if(!boundaryMatch)throw new Error("Invalid MHTML: MIME boundary not found.");
  const boundary=(boundaryMatch[1]||boundaryMatch[2]).trim();const chunks=raw.split("--"+boundary);const parts=[];
  for(let chunk of chunks){
    chunk=chunk.replace(/^\r?\n/,"");if(!chunk.trim()||chunk.trim()==="--")continue;
    const sep=chunk.search(/\r?\n\r?\n/);if(sep<0)continue;
    const headers=parseHeaders(chunk.slice(0,sep));let body=chunk.slice(sep).replace(/^\r?\n\r?\n/,"").replace(/\r?\n--$/i,"");
    const encoding=(headers["content-transfer-encoding"]||"").toLowerCase();if(encoding==="quoted-printable")body=unquotePrintable(body);
    parts.push({headers,body});
  }
  const htmlPart=parts.find(part=>(part.headers["content-type"]||"").toLowerCase().split(";")[0].trim()==="text/html");if(!htmlPart)throw new Error("No text/html part found in MHTML.");
  const images=[];
  for(const part of parts){
    const type=(part.headers["content-type"]||"").toLowerCase().split(";")[0].trim();
    if(type!=="image/jpeg"&&type!=="image/jpg")continue;
    const encoding=(part.headers["content-transfer-encoding"]||"").toLowerCase();if(encoding!=="base64")continue;
    images.push({type:"image/jpeg",location:part.headers["content-location"]||"",bytes:decodeBase64(part.body)});
  }
  return {html:htmlPart.body,images,parts};
}
function directRows(table){
  const rows=[];
  for(const child of table.children){
    if(child.tagName==="TR")rows.push(child);
    else if(["THEAD","TBODY","TFOOT"].includes(child.tagName))for(const row of child.children)if(row.tagName==="TR")rows.push(row);
  }
  return rows;
}
function directCells(row){return [...row.children].filter(el=>el.tagName==="TD"||el.tagName==="TH");}
function stripRowNumberColumn(values){
  const copy=[...values];
  if(copy.length && (copy[0]===""||/^\d+\.$/.test(copy[0])))copy.shift();
  return copy;
}
function parseHtml(html){
  const doc=new DOMParser().parseFromString(html,"text/html");let found=null;
  for(const table of doc.querySelectorAll("table")){
    for(const row of directRows(table)){
      const values=stripRowNumberColumn(directCells(row).map(clean));
      const lower=values.map(v=>v.toLowerCase());
      if(lower.includes("surname")&&lower.includes("preferred name")){found={table,row,headers:values};break;}
    }
    if(found)break;
  }
  if(!found)throw new Error("Could not find the iSAMS student table.");
  const rows=directRows(found.table);const headerIndex=rows.indexOf(found.row);const lower=found.headers.map(v=>v.toLowerCase());
  const surnameIndex=lower.indexOf("surname");const preferredIndex=lower.indexOf("preferred name");const students=[];
  for(const row of rows.slice(headerIndex+1)){
    const values=stripRowNumberColumn(directCells(row).map(clean));
    if(!values.length)continue;
    const fields={};found.headers.forEach((header,index)=>fields[header]=values[index]||"");
    if((values[surnameIndex]||"")||(values[preferredIndex]||""))students.push({name:[values[preferredIndex],values[surnameIndex]].filter(Boolean).join(" "),fields});
  }
  const meta={};
  for(const td of doc.querySelectorAll("td")){
    const key=clean(td).replace(/:$/g,"").toLowerCase();
    if(["teacher","grade group","subject","set name","set code"].includes(key)&&td.nextElementSibling)meta[key]=clean(td.nextElementSibling);
  }
  return {doc,headers:found.headers,students,meta};
}
function basename(value){try{return decodeURIComponent(value.split("/").pop().split("?")[0].split("#")[0]);}catch{return value.split("/").pop().split("?")[0].split("#")[0];}}
function extractGallery(doc){
  const gallery=[];
  for(const img of doc.querySelectorAll("img")){
    const src=img.getAttribute("src")||"";const href=img.closest("a")?.getAttribute("href")||src;const file=basename(href);
    if(!/\.jpe?g$/i.test(file))continue;
    const cell=img.closest("td");if(!cell)continue;
    const links=cell.querySelectorAll("a");if(!links.length)continue;
    const textNodes=[];for(const node of cell.childNodes)if(node.nodeType===3){const text=clean(node.textContent);if(text)textNodes.push(text);}
    gallery.push({file,name:clean(textNodes.join(" "))});
  }
  return gallery;
}
function attachPhotos(parsed,mhtml){
  const photoIndex=new Map();for(const image of mhtml.images){const key=basename(image.location).toLowerCase();if(key)photoIndex.set(key,image);}
  const gallery=extractGallery(parsed.doc);let matched=0;
  const surnameHeader=parsed.headers.find(h=>h.toLowerCase()==="surname");const preferredHeader=parsed.headers.find(h=>h.toLowerCase()==="preferred name");
  for(const student of parsed.students){
    const target=clean((student.fields[preferredHeader]||"")+" "+(student.fields[surnameHeader]||"")).toLowerCase();
    const exact=gallery.find(item=>clean(item.name).toLowerCase()===target);if(exact){const image=photoIndex.get(exact.file.toLowerCase());if(image){student.image=image;matched++;}}
  }
  if(gallery.length===parsed.students.length){
    parsed.students.forEach((student,index)=>{if(student.image)return;const image=photoIndex.get(gallery[index].file.toLowerCase());if(image){student.image=image;matched++;}});
  }
  return {gallery,matched};
}
function objectUrl(image){return URL.createObjectURL(new Blob([image.bytes],{type:image.type}));}
function render(parsed,mhtml,photos){
  result.hidden=false;result.replaceChildren();
  const title=document.createElement("h2");title.textContent=parsed.meta["set name"]||"Imported set";result.appendChild(title);
  const summary=document.createElement("div");summary.className="summary";
  [["Students",parsed.students.length],["Embedded JPEGs",mhtml.images.length],["Photos found",photos.gallery.length],["Photos matched",photos.matched]].forEach(([label,value])=>{const box=document.createElement("div");box.className="metric";const small=document.createElement("small");small.textContent=label;const strong=document.createElement("strong");strong.textContent=value;box.append(small,strong);summary.appendChild(box);});
  result.appendChild(summary);
  const fields=document.createElement("div");fields.className="fields";parsed.headers.forEach(header=>{const span=document.createElement("span");span.className="field";span.textContent=header;fields.appendChild(span);});result.appendChild(fields);
  const table=document.createElement("table");const thead=document.createElement("thead"),hr=document.createElement("tr");["Photo","Name",...parsed.headers].forEach(header=>{const th=document.createElement("th");th.textContent=header;hr.appendChild(th);});thead.appendChild(hr);table.appendChild(thead);
  const tbody=document.createElement("tbody");
  parsed.students.forEach(student=>{const row=document.createElement("tr");const photoCell=document.createElement("td");if(student.image){const img=document.createElement("img");img.className="student-photo";img.src=objectUrl(student.image);img.alt="";photoCell.appendChild(img);}else photoCell.textContent="—";row.appendChild(photoCell);const name=document.createElement("td");name.textContent=student.name;row.appendChild(name);for(const header of parsed.headers){const cell=document.createElement("td");cell.textContent=student.fields[header]||"";row.appendChild(cell);}tbody.appendChild(row);});
  table.appendChild(tbody);result.appendChild(table);
}
fileInput.addEventListener("change",async()=>{
  const file=fileInput.files?.[0];if(!file)return;setStatus("Reading "+file.name+"...");
  try{const raw=await file.text();const m=parseMhtml(raw);const parsed=parseHtml(m.html);const photos=attachPhotos(parsed,m);render(parsed,m,photos);setStatus("Import successful - "+parsed.students.length+" students, "+photos.matched+" photos matched.","ok");}
  catch(error){console.error(error);setStatus("Import failed: "+error.message,"bad");}
});
</script>
</body>
</html>
