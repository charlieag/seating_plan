<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seating Planner</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fa;color:#18202a}main{max-width:1100px;margin:auto;padding:28px 20px}.card{background:#fff;border:1px solid #d8dee6;border-radius:12px;padding:20px;margin-bottom:16px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.button,.file-label{font:inherit;padding:10px 15px;border-radius:8px;border:1px solid #285bd6;background:#285bd6;color:white;cursor:pointer;display:inline-block}.secondary{background:white;color:#18202a;border-color:#bcc5d1}.danger{background:white;color:#a52727;border-color:#d99}.status{padding:11px;border-radius:8px;background:#eef1f5;margin-top:12px}.ok{background:#eaf7ef;color:#17683a}.bad{background:#fff0f0;color:#9e2929}.class-card{border:1px solid #d8dee6;border-radius:10px;padding:16px;margin:10px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.class-name{font-size:18px;font-weight:700}.muted{font-size:13px;color:#697584}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.pill{display:inline-block;padding:4px 8px;background:#f0f2f5;border:1px solid #dde2e8;border-radius:999px;font-size:12px;margin:3px}.student{display:flex;gap:14px;align-items:center;border-bottom:1px solid #e2e6eb;padding:10px 0}.photo{width:54px;height:68px;object-fit:cover;border-radius:7px;background:#eef1f4;border:1px solid #d8dee6}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px;border-bottom:1px solid #e2e6eb;text-align:left;vertical-align:top}.table th{background:#f8f9fb;font-size:13px}.scroll{overflow:auto}.back{margin-bottom:12px}</style></head><body><main><div class="card"><div class="top"><div><h1 style="margin:0">Seating Planner</h1><div class="muted">Class manager · Build 0.6.0</div></div><label class="file-label" for="file">Import iSAMS MHTML</label><input id="file" type="file" style="position:absolute;left:-9999px"></div><div id="status" class="status">Ready.</div></div><section id="home"><div class="card"><h2>My Classes</h2><div id="classes">Loading…</div></div></section><section id="detail" class="hidden"><button class="button secondary back" id="back">← Back to classes</button><div class="card"><div class="top"><div><h2 id="detailName" style="margin:0"></h2><div id="detailMeta" class="muted"></div></div><button id="delete" class="button danger">Delete class</button></div></div><div class="card"><h3>Students</h3><div id="students"></div></div></section><div id="importResult" class="hidden"></div></main><script>
'use strict';const DB='seatingPlannerV1';let db=null,current=null;const $=id=>document.getElementById(id);function clean(v){if(v==null)return'';const t=typeof v==='string'?v:(v.textContent||String(v));return t.replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()}function norm(s){return clean(s).toLowerCase().replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}function status(m,k){$('status').textContent=m;$('status').className='status'+(k?' '+k:'')}
function hs(b){const o={};let c='';for(const l of b.replace(/\r\n/g,'\n').split('\n')){if(/^[ \t]/.test(l)&&c){o[c]+=' '+l.trim();continue}const m=l.match(/^([^:]+):\s*(.*)$/);if(m){c=m[1].toLowerCase();o[c]=m[2].trim()}}return o}function b64(s){const b=atob(s.replace(/[\r\n\t ]/g,'')),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}function qp(s){return s.replace(/=\r?\n/g,'').replace(/=([0-9A-Fa-f]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)))}function parseM(raw){const p=raw.search(/\r?\n\r?\n/);if(p<0)throw Error('Invalid MHTML');const top=hs(raw.slice(0,p)),bm=(top['content-type']||'').match(/boundary\s*=\s*(?:"([^"]+)"|([^;]+))/i);if(!bm)throw Error('MHTML boundary not found');const bd=(bm[1]||bm[2]).trim(),parts=[];for(let ch of raw.split('--'+bd)){ch=ch.replace(/^\r?\n/,'');if(!ch.trim()||ch.trim()==='--')continue;const s=ch.search(/\r?\n\r?\n/);if(s<0)continue;const h=hs(ch.slice(0,s));let body=ch.slice(s).replace(/^\r?\n\r?\n/,'').replace(/\r?\n--$/i,'');if((h['content-transfer-encoding']||'').toLowerCase()==='quoted-printable')body=qp(body);parts.push({h,b:body})}const html=parts.find(x=>(x.h['content-type']||'').toLowerCase().split(';')[0].trim()==='text/html');if(!html)throw Error('No HTML part found');const imgs=parts.filter(x=>/^image\/(jpeg|jpg)$/i.test((x.h['content-type']||'').split(';')[0])&&(x.h['content-transfer-encoding']||'').toLowerCase()==='base64').map(x=>({name:(x.h['content-location']||'').split('/').pop(),bytes:b64(x.b)}));return{html:html.b,imgs}}
function trs(t){const a=[];for(const c of t.children){if(c.tagName==='TR')a.push(c);else if(/^(THEAD|TBODY|TFOOT)$/.test(c.tagName))for(const r of c.children)if(r.tagName==='TR')a.push(r)}return a}function cells(r){return[...r.children].filter(x=>x.tagName==='TD'||x.tagName==='TH')}function vals(r){const a=cells(r).map(clean);if(/^\d+\.$/.test(a[0]||''))a.shift();return a}function isStudent(t){return trs(t).some(r=>{const v=vals(r).map(x=>x.toLowerCase());return v.includes('surname')&&v.includes('preferred name')})}function students(t){const rs=trs(t);let hi=-1,h=[];for(let i=0;i<rs.length;i++){const v=vals(rs[i]),l=v.map(x=>x.toLowerCase());if(l.includes('surname')&&l.includes('preferred name')){hi=i;h=v;break}}const si=h.findIndex(x=>x.toLowerCase()==='surname'),pi=h.findIndex(x=>x.toLowerCase()==='preferred name'),out=[];for(const r of rs.slice(hi+1)){const v=vals(r);if(!v.length)continue;if((v[si]||'')||(v[pi]||'')){const f={};h.forEach((x,i)=>f[x]=v[i]||'');out.push({id:crypto.randomUUID(),surname:v[si]||'',preferred:v[pi]||'',fields:f,seat:null})}}return{headers:h,students:out}}
function cname(doc,t){let el=t.parentElement;for(let i=0;el&&i<7;i++,el=el.parentElement){const x=clean(el.textContent),m=x.match(/Set Name\s*:?\s*(.+?)(?=Teacher\s*:|Grade Group\s*:|Linked Teachers\s*:|Subject\s*:|Set Code\s*:|Set List|$)/i);if(m)return clean(m[1])}return'Unnamed class'}function parseAll(m){const d=new DOMParser().parseFromString(m.html,'text/html');const ts=[...d.querySelectorAll('table')].filter(isStudent);if(!ts.length)throw Error('No iSAMS student tables found');return ts.map(t=>{const p=students(t);return{id:crypto.randomUUID(),name:cname(d,t),headers:p.headers,students:p.students,updated:Date.now(),seatingPlans:[],rooms:[]}})}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('classes'))r.result.createObjectStore('classes',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function all(){if(!db)db=await openDB();return new Promise((res,rej)=>{const r=db.transaction('classes').objectStore('classes').getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function put(c){if(!db)db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('classes','readwrite');tx.objectStore('classes').put(c);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}async function del(id){if(!db)db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('classes','readwrite');tx.objectStore('classes').delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
function renderHome(){ $('home').classList.remove('hidden');$('detail').classList.add('hidden');$('importResult').classList.add('hidden');all().then(cs=>{const el=$('classes');el.replaceChildren();if(!cs.length){el.innerHTML='<p class="muted">No classes imported yet.</p>';return}cs.forEach(c=>{const d=document.createElement('div');d.className='class-card';const info=document.createElement('div');const n=document.createElement('div');n.className='class-name';n.textContent=c.name;const m=document.createElement('div');m.className='muted';m.textContent=c.students.length+' students · Updated '+new Date(c.updated).toLocaleString();info.append(n,m);const b=document.createElement('button');b.className='button';b.textContent='Open';b.onclick=()=>openClass(c.id);d.append(info,b);el.appendChild(d)})})}
async function openClass(id){const cs=await all();current=cs.find(c=>c.id===id);if(!current)return;$('home').classList.add('hidden');$('detail').classList.remove('hidden');$('importResult').classList.add('hidden');$('detailName').textContent=current.name;$('detailMeta').textContent=current.students.length+' students · Last imported '+new Date(current.updated).toLocaleString();const box=$('students');box.replaceChildren();current.students.forEach(s=>{const d=document.createElement('div');d.className='student';if(s.image){const im=document.createElement('img');im.className='photo';im.src=URL.createObjectURL(new Blob([s.image],{type:'image/jpeg'}));d.appendChild(im)}const x=document.createElement('div');x.innerHTML='<strong></strong><div class="muted"></div>';x.firstChild.textContent=(s.preferred||s.surname)+' '+(s.preferred?s.surname:'');x.querySelector('.muted').textContent=Object.entries(s.fields).filter(([k])=>!['Surname','Preferred Name'].includes(k)).map(([k,v])=>k+': '+v).filter(x=>x.split(': ')[1]).join(' · ');d.appendChild(x);box.appendChild(d)})}
$('back').onclick=renderHome;$('delete').onclick=async()=>{if(!current)return;if(!confirm('Permanently delete '+current.name+' and all stored student data and photographs? This cannot be undone.'))return;const id=current.id;await del(id);current=null;status('Class permanently deleted.','ok');renderHome()};
fileInput.addEventListener('change',async()=>{const f=fileInput.files?.[0];if(!f)return;status('Reading '+f.name+'...');try{const parsed=parseAll(parseM(await f.text())),old=await all(),map=new Map(old.map(c=>[norm(c.name),c])),added=[],updated=[];for(const c of parsed){const o=map.get(norm(c.name));if(o){c.id=o.id;c.seatingPlans=o.seatingPlans||[];c.rooms=o.rooms||[];const oldByName=new Map(o.students.map(s=>[norm((s.preferred||'')+' '+(s.surname||'')),s]));c.students.forEach(s=>{const os=oldByName.get(norm(s.preferred+' '+s.surname));if(os){s.id=os.id;s.seat=os.seat||null}});updated.push(c.name)}else added.push(c.name);c.updated=Date.now();await put(c)}status('Import complete: '+added.length+' new, '+updated.length+' updated.','ok');renderHome()}catch(e){console.error(e);status('Import failed: '+e.message,'bad')}});renderHome();
</script></body></html>
