<!doctype html><html><head><meta charset="utf-8"><title>Seating Planner - Build 0.6.1</title><style>body{font-family:Arial,sans-serif;margin:30px;background:#f5f7fa;color:#18202a}.card{background:white;padding:20px;border-radius:10px;margin-bottom:15px;border:1px solid #ddd}button,label{padding:10px 14px;border-radius:7px;border:1px solid #285bd6;background:#285bd6;color:white;cursor:pointer;display:inline-block}.status{margin-top:15px;padding:12px;background:#eef1f5;white-space:pre-wrap}.bad{background:#fff0f0;color:#900}.ok{background:#eaf7ef;color:#17683a}.class{padding:12px;border:1px solid #ddd;border-radius:8px;margin:8px 0;display:flex;justify-content:space-between}.muted{color:#697584;font-size:13px}#file{display:none}</style></head><body><div class="card"><h1>Seating Planner</h1><b>Build 0.6.1</b><p class="muted">Class manager prototype</p><label for="file">Choose iSAMS MHTML</label><input id="file" type="file"><div id="status" class="status">Ready.</div></div><div class="card"><h2>My Classes</h2><div id="classes">Loading…</div></div><script>
const DB='seatingPlannerV1';const $=x=>document.getElementById(x);function uid(){return 'id-'+Date.now()+'-'+Math.random().toString(36).slice(2)}function clean(x){return String(x??'').replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()}function norm(x){return clean(x).toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}function st(x,c=''){ $('status').textContent=x;$('status').className='status '+c}function headers(s){let o={},k='';for(const l of s.replace(/\r\n/g,'\n').split('\n')){if(/^[ \t]/.test(l)&&k)o[k]+=' '+l.trim();else{const m=l.match(/^([^:]+):\s*(.*)$/);if(m){k=m[1].toLowerCase();o[k]=m[2].trim()}}}return o}function b64(s){const b=atob(s.replace(/[\r\n ]/g,'')),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}function parseM(raw){const p=raw.search(/\r?\n\r?\n/);if(p<0)throw Error('No MIME header');const top=headers(raw.slice(0,p)),m=(top['content-type']||'').match(/boundary\s*=\s*(?:"([^"]+)"|([^;]+))/i);if(!m)throw Error('No MHTML boundary');const bd=(m[1]||m[2]).trim(),parts=[];for(let q of raw.split('--'+bd)){q=q.replace(/^\r?\n/,'');const s=q.search(/\r?\n\r?\n/);if(s<0)continue;const h=headers(q.slice(0,s));let b=q.slice(s).replace(/^\r?\n\r?\n/,'');if((h['content-transfer-encoding']||'').toLowerCase()==='quoted-printable')b=b.replace(/=\r?\n/g,'').replace(/=([0-9a-f]{2})/gi,(_,z)=>String.fromCharCode(parseInt(z,16)));parts.push({h,b})}const html=parts.find(p=>(p.h['content-type']||'').toLowerCase().startsWith('text/html'));if(!html)throw Error('No HTML part');return html.b}
function trs(t){let a=[];for(const x of t.children){if(x.tagName==='TR')a.push(x);else if(/^(THEAD|TBODY|TFOOT)$/.test(x.tagName))a.push(...[...x.children].filter(y=>y.tagName==='TR'))}return a}function vals(r){let a=[...r.children].filter(x=>x.tagName==='TD'||x.tagName==='TH').map(clean);if(/^\d+\.$/.test(a[0]||''))a.shift();return a}function studentTable(t){return trs(t).some(r=>{const v=vals(r).map(x=>x.toLowerCase());return v.includes('surname')&&v.includes('preferred name')})}function parseStudents(t){const rs=trs(t);let h=[];let i=rs.findIndex(r=>{const v=vals(r);h=v;const l=v.map(x=>x.toLowerCase());return l.includes('surname')&&l.includes('preferred name')});if(i<0)throw Error('Student header missing');const si=h.findIndex(x=>x.toLowerCase()==='surname'),pi=h.findIndex(x=>x.toLowerCase()==='preferred name'),out=[];for(const r of rs.slice(i+1)){const v=vals(r);if(!v.length)continue;const f={};h.forEach((x,j)=>f[x]=v[j]||'');if(v[si]||v[pi])out.push({id:uid(),surname:v[si]||'',preferred:v[pi]||'',fields:f,seat:null})}return{headers:h,students:out}}
function className(t){let el=t;for(let i=0;el&&i<8;i++,el=el.parentElement){const x=clean(el.textContent),m=x.match(/Set Name\s*:?\s*(.+?)(?=Teacher\s*:|Grade Group\s*:|Linked Teachers\s*:|Subject\s*:|Set Code\s*:|Set List|$)/i);if(m)return clean(m[1])}return'Unnamed class'}function parseAll(html){const d=new DOMParser().parseFromString(html,'text/html'),ts=[...d.querySelectorAll('table')].filter(studentTable);if(!ts.length)throw Error('No iSAMS student tables found');return ts.map(t=>{const p=parseStudents(t);return{id:uid(),name:className(t),headers:p.headers,students:p.students,updated:Date.now(),seatingPlans:[],rooms:[]}})}
function dbOpen(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('classes'))r.result.createObjectStore('classes',{keyPath:'id'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}async function getAll(){const d=await dbOpen();return new Promise((res,rej)=>{const r=d.transaction('classes','readonly').objectStore('classes').getAll();r.onsuccess=()=>{d.close();res(r.result)};r.onerror=()=>rej(r.error)})}async function save(c){const d=await dbOpen();return new Promise((res,rej)=>{const t=d.transaction('classes','readwrite');t.objectStore('classes').put(c);t.oncomplete=()=>{d.close();res()};t.onerror=()=>rej(t.error)})}
async function render(){try{const cs=await getAll(),el=$('classes');el.replaceChildren();if(!cs.length){el.textContent='No classes imported yet.';return}cs.sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>{const d=document.createElement('div');d.className='class';const x=document.createElement('span');x.innerHTML='<b></b><br><small></small>';x.querySelector('b').textContent=c.name;x.querySelector('small').textContent=c.students.length+' students · '+new Date(c.updated).toLocaleString();const b=document.createElement('button');b.textContent='Open';b.onclick=()=>alert(c.students.map(s=>(s.preferred||s.surname)+' '+(s.preferred?s.surname:'')).join('\n'));d.append(x,b);el.append(d)})}catch(e){st('Could not load saved data: '+e.message,'bad')}}
$('file').addEventListener('change',async e=>{const f=e.target.files&&e.target.files[0];if(!f)return;st('Selected '+f.name+'\nReading…');try{const html=parseM(await f.text());st('MHTML parsed. Finding classes…');const incoming=parseAll(html),existing=await getAll(),map=new Map(existing.map(c=>[norm(c.name),c]));let added=0,updated=0;for(const c of incoming){const old=map.get(norm(c.name));if(old){c.id=old.id;c.seatingPlans=old.seatingPlans||[];c.rooms=old.rooms||[];const om=new Map(old.students.map(s=>[norm((s.preferred||'')+' '+(s.surname||'')),s]));c.students.forEach(s=>{const o=om.get(norm(s.preferred+' '+s.surname));if(o){s.id=o.id;s.seat=o.seat||null}});updated++}else added++;await save(c)}st('Import complete: '+added+' new, '+updated+' updated.','ok');await render()}catch(e){console.error(e);st('Import failed:\n'+(e.stack||e.message||e),'bad')}});render();
</script></body></html>
