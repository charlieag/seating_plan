<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seating Planner - Class Import</title><style>body{font-family:system-ui,sans-serif;margin:0;background:#f5f7fa;color:#18202a}main{max-width:1100px;margin:auto;padding:32px 20px}.card{background:#fff;border:1px solid #d8dee6;border-radius:12px;padding:22px;margin-bottom:16px}.file-label,.button{font:inherit;padding:10px 15px;border-radius:8px;border:1px solid #285bd6;background:#285bd6;color:#fff;cursor:pointer;display:inline-block}.button.secondary{background:#fff;color:#18202a;border-color:#bcc5d1}.status{padding:12px;margin-top:14px;border-radius:8px;background:#eef1f5}.ok{background:#eaf7ef;color:#17683a}.bad{background:#fff0f0;color:#9e2929}.class-card{border:1px solid #d8dee6;border-radius:10px;padding:16px;margin:10px 0}.class-head{display:flex;gap:12px;align-items:flex-start}.class-head input{width:20px;height:20px}.class-name{font-weight:700;font-size:17px}.muted{color:#697584;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.version{color:#697584;font-size:12px}.stored{margin-top:12px;padding:12px;background:#f8f9fb;border-radius:8px}.danger{color:#9e2929}</style></head><body><main><div class="card"><h1>Seating Planner</h1><p><strong>Class manager prototype</strong></p><p class="version">Build 0.5.0</p><p class="muted">MHTML is read locally. Imported class data is stored in this browser for this prototype.</p><label class="file-label" for="file">Choose iSAMS MHTML</label><input id="file" type="file" style="position:absolute;left:-9999px"><div id="status" class="status">Ready.</div></div><div id="stored" class="card"><h2>Stored classes</h2><div id="storedList" class="muted">No classes stored yet.</div></div><div id="result" hidden></div></main><script>
"use strict";const fileInput=document.getElementById('file'),statusBox=document.getElementById('status'),result=document.getElementById('result'),storedList=document.getElementById('storedList');const DB='seatingPlannerV1';
function clean(v){if(v==null)return'';const t=typeof v==='string'?v:(typeof v.textContent==='string'?v.textContent:String(v));return t.replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()};function setStatus(m,k){statusBox.textContent=m;statusBox.className='status'+(k?' '+k:'')};function qp(s){return s.replace(/=\r?\n/g,'').replace(/=([0-9A-Fa-f]{2})/g,(_,h)=>String.fromCharCode(parseInt(h,16)))}function b64(s){const b=atob(s.replace(/[\r\n\t ]/g,''));const a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a}function hs(b){const o={};let c='';for(const l of b.replace(/\r\n/g,'\n').split('\n')){if(/^[ \t]/.test(l)&&c){o[c]+=' '+l.trim();continue}const m=l.match(/^([^:]+):\s*(.*)$/);if(m){c=m[1].toLowerCase();o[c]=m[2].trim()}}return o}
function mhtml(raw){const p=raw.search(/\r?\n\r?\n/);if(p<0)throw Error('Invalid MHTML: MIME headers not found.');const top=hs(raw.slice(0,p)),bm=(top['content-type']||'').match(/boundary\s*=\s*(?:"([^"]+)"|([^;]+))/i);if(!bm)throw Error('Invalid MHTML: MIME boundary not found.');const bd=(bm[1]||bm[2]).trim(),parts=[];for(let ch of raw.split('--'+bd)){ch=ch.replace(/^\r?\n/,'');if(!ch.trim()||ch.trim()==='--')continue;const s=ch.search(/\r?\n\r?\n/);if(s<0)continue;const h=hs(ch.slice(0,s));let body=ch.slice(s).replace(/^\r?\n\r?\n/,'').replace(/\r?\n--$/i,'');if((h['content-transfer-encoding']||'').toLowerCase()==='quoted-printable')body=qp(body);parts.push({headers:h,body})}const html=parts.find(x=>(x.headers['content-type']||'').toLowerCase().split(';')[0].trim()==='text/html');if(!html)throw Error('No text/html part found.');const images=parts.filter(x=>/^image\/(jpeg|jpg)$/i.test((x.headers['content-type']||'').split(';')[0])&&(x.headers['content-transfer-encoding']||'').toLowerCase()==='base64').map(x=>({location:x.headers['content-location']||'',bytes:b64(x.body)}));return{html:html.body,images}}
function rows(t){const a=[];for(const c of t.children){if(c.tagName==='TR')a.push(c);else if(/^(THEAD|TBODY|TFOOT)$/.test(c.tagName))for(const r of c.children)if(r.tagName==='TR')a.push(r)}return a}function cells(r){return[...r.children].filter(e=>e.tagName==='TD'||e.tagName==='TH')}function noNum(v){const a=[...v];if(a[0]&&/^\d+\.$/.test(a[0]))a.shift();return a}function studentTable(t){return rows(t).some(r=>{const v=noNum(cells(r).map(clean)).map(x=>x.toLowerCase());return v.includes('surname')&&v.includes('preferred name')})}
function parseStudents(t){const rs=rows(t);let h=-1,headers=[];for(let i=0;i<rs.length;i++){const v=noNum(cells(rs[i]).map(clean));const l=v.map(x=>x.toLowerCase());if(l.includes('surname')&&l.includes('preferred name')){h=i;headers=v;break}}if(h<0)throw Error('Student table header not found.');const si=headers.findIndex(x=>x.toLowerCase()==='surname'),pi=headers.findIndex(x=>x.toLowerCase()==='preferred name'),students=[];for(const r of rs.slice(h+1)){const v=noNum(cells(r).map(clean));if(!v.length)continue;const f={};headers.forEach((x,i)=>f[x]=v[i]||'');if((v[si]||'')||(v[pi]||''))students.push({id:crypto.randomUUID(),surname:v[si]||'',preferred:v[pi]||'',fields:f})}return{headers,students}}
function nameNorm(s){return clean(s).toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9 ]+/g,' ').replace(/\s+/g,' ').trim()}function base(u){try{return decodeURIComponent((u||'').split('/').pop().split('?')[0].split('#')[0])}catch{return(u||'').split('/').pop()}}function gallery(doc){const a=[];for(const img of doc.querySelectorAll('img')){const href=img.closest('a')?.getAttribute('href')||img.getAttribute('src')||'',f=base(href);if(!/\.jpe?g$/i.test(f))continue;const td=img.closest('td');if(!td)continue;let txt='';for(const n of td.childNodes)if(n.nodeType===3)txt+=' '+n.textContent;a.push({file:f,name:clean(txt)})}return a}
function matchPhotos(students,gal,images){const imap=new Map(images.map(x=>[base(x.location).toLowerCase(),x])),used=new Set();let matched=0;for(const s of students){const wanted=[nameNorm(s.preferred+' '+s.surname),nameNorm(s.surname+' '+s.preferred)];const g=gal.find(x=>!used.has(x.file)&&wanted.some(w=>{const n=nameNorm(x.name);return n===w||n.includes(w)||w.includes(n)}));if(g&&imap.has(g.file.toLowerCase())){s.imageKey=g.file;s.image=imap.get(g.file.toLowerCase()).bytes;used.add(g.file);matched++}}return matched}
function className(doc,table){let el=table.parentElement;for(let i=0;el&&i<7;i++,el=el.parentElement){const t=clean(el.textContent),m=t.match(/Set Name\s*:?\s*(.+?)(?=Teacher\s*:|Grade Group\s*:|Linked Teachers\s*:|Subject\s*:|Set Code\s*:|Set List|$)/i);if(m)return clean(m[1])}return'Unnamed class'}
function parseAll(m){const doc=new DOMParser().parseFromString(m.html,'text/html'),tables=[...doc.querySelectorAll('table')],st=tables.filter(studentTable);if(!st.length)throw Error('No iSAMS student tables found.');return st.map(t=>{const p=parseStudents(t),name=className(doc,t);return{id:crypto.randomUUID(),name,headers:p.headers,students:p.students,photoCount:0}})}
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('classes'))r.result.createObjectStore('classes',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}async function saveClasses(classes){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('classes','readwrite'),s=tx.objectStore('classes');for(const c of classes)s.put(c);tx.oncomplete=()=>{db.close();res()};tx.onerror=()=>rej(tx.error)})}async function loadClasses(){const db=await openDB();return new Promise((res,rej)=>{const tx=db.transaction('classes','readonly'),r=tx.objectStore('classes').getAll();r.onsuccess=()=>{db.close();res(r.result)};r.onerror=()=>rej(r.error)})}
function renderStored(classes){if(!classes.length){storedList.textContent='No classes stored yet.';return}storedList.replaceChildren();classes.forEach(c=>{const d=document.createElement('div');d.className='stored';d.innerHTML='<strong></strong><div class="muted"></div>';d.querySelector('strong').textContent=c.name;d.querySelector('.muted').textContent=c.students.length+' students · '+(c.updated?new Date(c.updated).toLocaleString():'Imported');storedList.appendChild(d)})}
async function show(){renderStored(await loadClasses())}async function importSelected(data,checks){const chosen=data.filter((_,i)=>checks[i]);const existing=await loadClasses();const byName=new Map(existing.map(c=>[nameNorm(c.name),c]));const added=[],updated=[];for(const incoming of chosen){const old=byName.get(nameNorm(incoming.name));if(old){incoming.id=old.id;incoming.updated=Date.now();incoming.seatingPlans=old.seatingPlans||[];incoming.rooms=old.rooms||[];incoming.students.forEach(ns=>{const os=old.students.find(x=>nameNorm((x.preferred||'')+' '+(x.surname||''))===nameNorm((ns.preferred||'')+' '+(ns.surname||'')));if(os){ns.id=os.id;ns.seat=os.seat||null}else ns.seat=null});await saveClasses([incoming]);updated.push(incoming.name)}else{incoming.updated=Date.now();incoming.seatingPlans=[];incoming.rooms=[];incoming.students.forEach(s=>s.seat=null);await saveClasses([incoming]);added.push(incoming.name)}}await show();result.innerHTML='<div class="card"><h2>Import complete</h2><p><strong>'+chosen.length+'</strong> class(es) processed.</p><p>'+added.length+' new · '+updated.length+' updated</p></div>';result.hidden=false;setStatus('Import complete. Existing seating-plan data was preserved.','ok')}
fileInput.addEventListener('change',async()=>{const f=fileInput.files?.[0];if(!f)return;setStatus('Reading '+f.name+'...');try{const m=mhtml(await f.text()),data=parseAll(m);result.hidden=false;result.innerHTML='<div class="card"><h2>'+data.length+' classes detected</h2><p class="muted">Select the classes you want to add or update.</p><div id="classes"></div><div class="actions"><button id="doImport" class="button">Import selected classes</button></div></div>';const list=document.getElementById('classes');data.forEach((c,i)=>{const d=document.createElement('div');d.className='class-card';d.innerHTML='<div class="class-head"><input type="checkbox" checked data-i="'+i+'"><div><div class="class-name"></div><div class="muted"></div></div></div>';d.querySelector('.class-name').textContent=c.name;d.querySelector('.muted').textContent=c.students.length+' students · '+c.headers.length+' fields';list.appendChild(d)});document.getElementById('doImport').onclick=()=>importSelected(data,[...list.querySelectorAll('input')].map(x=>x.checked));setStatus('Import analysis complete - '+data.length+' classes detected.','ok')}catch(e){console.error(e);setStatus('Import failed: '+e.message,'bad')}});show();
</script></body></html>
